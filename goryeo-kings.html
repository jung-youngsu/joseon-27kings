<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>고려의 왕 시리즈 — 34대 왕</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600;700;900&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#13100d;--ink-soft:#1e1a15;--ink-mid:#2a2318;
  --gold:#c9a84c;--gold-light:#e8c97a;--gold-dim:#7a6330;
  --text-primary:#f0ead8;--text-secondary:#b0a080;--text-muted:#7a6a50;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--ink);color:var(--text-primary);font-family:'Noto Serif KR',serif;overflow-x:hidden;}
nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:14px 28px;background:rgba(19,16,13,0.95);backdrop-filter:blur(6px);border-bottom:1px solid rgba(201,168,76,0.1);}
.nav-back{font-family:'Noto Sans KR',sans-serif;font-size:13px;color:var(--text-muted);text-decoration:none;transition:color .2s;}
.nav-back:hover{color:var(--gold);}
.nav-brand{font-size:13px;font-weight:700;letter-spacing:.2em;color:var(--gold);}
.nav-next{font-family:'Noto Sans KR',sans-serif;font-size:12px;color:var(--text-muted);text-decoration:none;}
.nav-next:hover{color:var(--gold);}
.hero-tag{font-family:'Noto Sans KR',sans-serif;font-size:11px;letter-spacing:.3em;color:var(--gold-dim);margin-bottom:12px;}
.hero-sub{font-family:'Noto Sans KR',sans-serif;font-size:12px;color:var(--text-secondary);line-height:1.8;}
#goryeo-section{max-width:520px;margin:0 auto;padding:82px 20px 12px;text-align:center;}
.gr-title{font-size:clamp(19px,4vw,30px);font-weight:900;letter-spacing:.1em;margin-bottom:8px;}
.gr-list{list-style:none;margin:18px 0 0;display:flex;flex-direction:column;gap:6px;text-align:left;}
.gr-row{display:flex;align-items:center;gap:12px;padding:10px 14px;background:#242018;border:1px solid #3a3428;color:var(--text-muted);font-family:'Noto Sans KR',sans-serif;font-size:12px;text-decoration:none;}
.gr-row .gr-n{flex:0 0 34px;font-size:11px;color:var(--text-muted);}
.gr-row .gr-k{flex:0 0 auto;font-family:'Noto Serif KR',serif;font-size:15px;font-weight:700;color:var(--text-secondary);}
.gr-row .gr-nm{flex:1 1 auto;min-width:0;}
.gr-row .gr-r{flex:0 0 auto;font-size:11px;}
.gr-row .gr-tag{display:block;font-family:'Noto Serif KR',serif;font-size:12px;color:var(--gold);margin-top:2px;}
a.gr-row.live{background:#2a2312;border-color:var(--gold-dim);border-left:3px solid var(--gold);}
a.gr-row.live .gr-k{color:var(--gold-light);}
a.gr-row.live:hover{border-color:var(--gold);}

.next-era{display:inline-block;margin:24px 0 8px;padding:8px 18px;border:1px solid var(--gold-dim);color:var(--gold);font-family:'Noto Sans KR',sans-serif;font-size:12px;text-decoration:none;}
.next-era:hover{border-color:var(--gold);}
footer{padding:28px 20px;text-align:center;border-top:1px solid rgba(201,168,76,0.08);margin-top:24px;}
.footer-text{font-family:'Noto Sans KR',sans-serif;font-size:12px;color:var(--text-muted);line-height:2;}
</style>
</head>
<body>

<nav>
  <a class="nav-back" href="index.html">← 메인으로</a>
  <div class="nav-brand">고려의 왕 시리즈</div>
  <a class="nav-next" href="joseon-kings.html">조선의 왕 →</a>
</nav>

<section id="goryeo-section">
  <div class="hero-tag">GORYEO DYNASTY · 918 – 1392</div>
  <h1 class="gr-title">고려 34대 왕</h1>
  <p class="hero-sub">조선보다 먼저, 474년<br>금색 왕을 누르면 시리즈 콘텐츠로 연결됩니다</p>
  <ol class="gr-list" id="gr-list"></ol>
  <a class="next-era" href="joseon-kings.html">다음 시대 · 조선 27대 왕 →</a>
</section>

<footer>
  <div class="footer-text">
    고려의 왕 시리즈 · <a href="index.html" style="color:var(--gold-dim);text-decoration:none;">메인으로</a><br>
    © 2025 IF YOU WERE. All rights reserved.
  </div>
</footer>

<script>
// ─── 고려 34왕 목록 ───────────────────────────────────────
// goryeo.json의 status가 live인 왕만 금색 링크가 된다.
(async function renderGoryeo(){
  const ol=document.getElementById('gr-list');
  if(!ol) return;
  let list=[];
  try{ list=await (await fetch('goryeo.json',{cache:'no-cache'})).json(); }catch(e){ return; }
  const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  ol.innerHTML=list.map(k=>{
    const live=k.status==='live';
    const inner='<span class="gr-n">'+k.ep+'대</span>'
      +'<span class="gr-k">'+esc(k.korName)+'</span>'
      +'<span class="gr-nm">'+esc(k.personalName)+(live&&k.tagline?'<span class="gr-tag">'+esc(k.tagline)+'</span>':'')+'</span>'
      +'<span class="gr-r">'+esc(k.reign)+'</span>';
    return live
      ? '<li><a class="gr-row live" href="episode.html?goryeo='+k.ep+'">'+inner+'</a></li>'
      : '<li><div class="gr-row">'+inner+'</div></li>';
  }).join('');
})();
</script>
</body>
</html>
