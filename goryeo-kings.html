<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>고려의 왕 시리즈 — 34대 왕</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600;700;900&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#13100d;--ink-soft:#1e1a15;--ink-mid:#2a2318;
  --gold:#c9a84c;--gold-light:#e8c97a;--gold-dim:#7a6330;
  --steel:#8fa3b3;--steel-dim:#4c5a66;
  --text-primary:#f0ead8;--text-secondary:#b0a080;--text-muted:#7a6a50;
  --celadon:#7fa89a;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;scroll-padding-top:110px;}
body{background:var(--ink);color:var(--text-primary);font-family:'Noto Serif KR',serif;overflow-x:hidden;}
a{color:inherit;}

/* ─── nav ─── */
nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:14px 28px;background:rgba(19,16,13,0.95);backdrop-filter:blur(6px);border-bottom:1px solid rgba(201,168,76,0.1);}
.nav-back,.nav-next{font-family:'Noto Sans KR',sans-serif;font-size:13px;color:var(--text-muted);text-decoration:none;transition:color .2s;}
.nav-back:hover,.nav-next:hover{color:var(--gold);}
.nav-brand{font-size:13px;font-weight:700;letter-spacing:.2em;color:var(--gold);}

/* ─── hero ─── */
.hero{position:relative;padding:118px 20px 54px;text-align:center;overflow:hidden;
  background:
    radial-gradient(ellipse 60% 55% at 50% 38%,rgba(127,168,154,0.13),transparent 70%),
    radial-gradient(ellipse 80% 60% at 50% 0%,rgba(201,168,76,0.10),transparent 70%);}
.hero::after{content:'';position:absolute;left:50%;bottom:0;width:min(640px,80%);height:1px;transform:translateX(-50%);
  background:linear-gradient(90deg,transparent,var(--gold-dim),transparent);}
.hero-mark{position:absolute;left:50%;top:50%;transform:translate(-50%,-46%);font-size:clamp(150px,30vw,300px);font-weight:900;letter-spacing:.05em;
  color:transparent;-webkit-text-stroke:1px rgba(201,168,76,0.09);pointer-events:none;user-select:none;white-space:nowrap;line-height:1;}
.hero-tag{position:relative;font-family:'Noto Sans KR',sans-serif;font-size:11px;letter-spacing:.35em;color:var(--celadon);margin-bottom:16px;}
.hero-title{position:relative;font-size:clamp(30px,6.5vw,52px);font-weight:900;letter-spacing:.14em;line-height:1.2;margin-bottom:14px;
  background:linear-gradient(180deg,var(--text-primary) 30%,var(--gold-light));-webkit-background-clip:text;background-clip:text;color:transparent;}
.hero-sub{position:relative;font-size:clamp(14px,2.4vw,16px);color:var(--text-secondary);line-height:1.9;}
.stats{position:relative;display:flex;justify-content:center;gap:clamp(18px,5vw,48px);margin-top:30px;}
.stat-n{font-size:clamp(24px,4.5vw,32px);font-weight:900;color:var(--gold);line-height:1;}
.stat-l{font-family:'Noto Sans KR',sans-serif;font-size:11px;letter-spacing:.15em;color:var(--text-muted);margin-top:8px;}

/* ─── period nav ─── */
.pnav{position:sticky;top:49px;z-index:50;background:rgba(19,16,13,0.92);backdrop-filter:blur(6px);border-bottom:1px solid rgba(201,168,76,0.08);}
.pnav-in{max-width:960px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding:10px 16px;scrollbar-width:none;}
.pnav-in::-webkit-scrollbar{display:none;}
.pchip{flex:0 0 auto;font-family:'Noto Sans KR',sans-serif;font-size:12px;color:var(--text-muted);text-decoration:none;padding:6px 13px;border:1px solid rgba(201,168,76,0.16);border-radius:999px;transition:all .2s;white-space:nowrap;}
.pchip b{color:var(--gold-dim);font-weight:700;margin-right:5px;}
.pchip:hover,.pchip.on{color:var(--gold-light);border-color:var(--gold);background:rgba(201,168,76,0.08);}
.pchip.on b{color:var(--gold);}

/* ─── periods ─── */
main{max-width:960px;margin:0 auto;padding:16px 20px 20px;}
.period{position:relative;padding:44px 0 8px;}
.p-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:22px;}
.p-no{flex:0 0 auto;width:46px;height:46px;display:flex;align-items:center;justify-content:center;border:1px solid var(--gold-dim);transform:rotate(45deg);margin:4px 6px 0 4px;}
.p-no span{transform:rotate(-45deg);font-size:15px;font-weight:900;color:var(--gold);}
.p-txt{min-width:0;}
.p-years{font-family:'Noto Sans KR',sans-serif;font-size:11px;letter-spacing:.2em;color:var(--text-muted);margin-bottom:4px;}
.p-name{font-size:clamp(19px,3.4vw,24px);font-weight:900;letter-spacing:.06em;margin-bottom:6px;}
.p-desc{font-family:'Noto Sans KR',sans-serif;font-size:13px;color:var(--text-secondary);line-height:1.8;}

.grid{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;}
.card{--ac:var(--gold);--ac-dim:var(--gold-dim);position:relative;display:flex;flex-direction:column;height:100%;padding:18px 18px 16px 20px;
  background:linear-gradient(160deg,#241f17,#1a1611 70%);border:1px solid rgba(201,168,76,0.14);text-decoration:none;color:var(--text-primary);
  overflow:hidden;transition:transform .25s,border-color .25s,box-shadow .25s;}
.card.cold{--ac:var(--steel);--ac-dim:var(--steel-dim);background:linear-gradient(160deg,#1d2023,#16171a 70%);border-color:rgba(143,163,179,0.14);}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ac);opacity:.75;transition:opacity .25s;}
.card-gen{position:absolute;right:12px;top:4px;font-size:58px;font-weight:900;line-height:1;color:transparent;-webkit-text-stroke:1px var(--ac-dim);opacity:.55;pointer-events:none;transition:opacity .25s;}
.card-top{font-family:'Noto Sans KR',sans-serif;font-size:11px;letter-spacing:.12em;color:var(--ac);margin-bottom:6px;}
.card-king{font-size:24px;font-weight:900;letter-spacing:.06em;line-height:1.2;}
.card-meta{font-family:'Noto Sans KR',sans-serif;font-size:12px;color:var(--text-muted);margin-top:4px;}
.card-tag{flex:1 1 auto;margin-top:14px;padding-top:12px;border-top:1px solid rgba(201,168,76,0.1);font-size:14px;line-height:1.65;color:var(--text-secondary);}
.card.cold .card-tag{border-top-color:rgba(143,163,179,0.12);}
.card-go{margin-top:12px;font-family:'Noto Sans KR',sans-serif;font-size:12px;color:var(--ac);opacity:.65;transition:opacity .25s,letter-spacing .25s;}
a.card:hover,a.card:focus-visible{transform:translateY(-3px);border-color:var(--ac);box-shadow:0 10px 28px rgba(0,0,0,.45),0 0 0 1px var(--ac-dim) inset;outline:none;}
a.card:hover::before,a.card:focus-visible::before{opacity:1;}
a.card:hover .card-gen{opacity:.9;}
a.card:hover .card-go{opacity:1;letter-spacing:.06em;}
a.card:hover .card-tag{color:var(--text-primary);}
.card.off{opacity:.45;}

.p-events{list-style:none;display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:12px;}
.p-events li{font-family:'Noto Sans KR',sans-serif;font-size:12px;color:var(--text-secondary);padding:4px 10px;background:rgba(201,168,76,0.05);border:1px solid rgba(201,168,76,0.12);}
.p-events li i{font-style:normal;color:var(--gold-dim);margin-right:6px;}
.term{font-weight:700;color:var(--gold-light);cursor:pointer;border-bottom:1px dotted var(--gold-dim);border-radius:2px;}
.term:hover,.term:focus-visible{background:rgba(201,168,76,0.16);outline:none;}
.gloss-pop{position:fixed;z-index:1000;left:0;top:0;max-width:min(300px,calc(100vw - 24px));padding:10px 14px;background:#2a2318;border:1px solid var(--gold-dim);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.5);color:var(--text-primary);font-family:'Noto Sans KR',sans-serif;font-size:14px;line-height:1.6;opacity:0;visibility:hidden;transition:opacity .15s;pointer-events:none;}
.gloss-pop.on{opacity:1;visibility:visible;pointer-events:auto;}
.gloss-pop b{display:block;margin-bottom:2px;color:var(--gold-light);font-family:'Noto Serif KR',serif;font-weight:600;}
.hint{position:relative;margin-top:22px;font-family:'Noto Sans KR',sans-serif;font-size:11px;color:var(--text-muted);}
.hint b{color:var(--gold-light);border-bottom:1px dotted var(--gold-dim);}

/* ─── bottom ─── */
.next-wrap{text-align:center;padding:48px 20px 16px;}
.next-era{display:inline-flex;flex-direction:column;gap:6px;padding:18px 34px;border:1px solid var(--gold-dim);text-decoration:none;transition:all .25s;}
.next-era small{font-family:'Noto Sans KR',sans-serif;font-size:11px;letter-spacing:.25em;color:var(--text-muted);}
.next-era span{font-size:17px;font-weight:700;color:var(--gold);}
.next-era:hover{border-color:var(--gold);background:rgba(201,168,76,0.06);}
footer{padding:28px 20px;text-align:center;border-top:1px solid rgba(201,168,76,0.08);margin-top:32px;}
.footer-text{font-family:'Noto Sans KR',sans-serif;font-size:12px;color:var(--text-muted);line-height:2;}

@media (max-width:600px){
  nav{padding:14px 16px;}
  .nav-brand{display:none;}
  main{padding:8px 16px 16px;}
  .grid{grid-template-columns:1fr;}
  .p-head{gap:12px;}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;}html{scroll-behavior:auto;}}
</style>
</head>

<nav>

<header class="hero">
  <div class="hero-mark" aria-hidden="true">高麗</div>

  <h1 class="hero-title">고려 34대 왕</h1>
  <p class="hero-sub">조선보다 먼저, 474년을 이어 간 왕들.<br>한 사람을 골라 그 왕의 자리에 앉아 보세요.</p>
  <div class="stats">
    <div><div class="stat-n" id="st-kings">34</div><div class="stat-l">왕</div></div>
    <div><div class="stat-n">474</div><div class="stat-l">년</div></div>
    <div><div class="stat-n">5</div><div class="stat-l">시기</div></div>
  </div>
  <p class="hint"><b>굵은 낱말</b>을 누르면 풀이가 나옵니다</p>

<div class="pnav"><div class="pnav-in" id="pnav"></div></div>

<main id="periods"></main>

</div>

<footer>
  <div class="footer-text">
    고려의 왕 시리즈 · <a href="index.html" style="color:var(--gold-dim);text-decoration:none;">메인으로</a><br>

  </div>
</footer>

<script>
// ─── 고려 34왕 목록 ───────────────────────────────────────
// goryeo.json을 다섯 시기로 묶어 카드로 그린다. status가 live인 왕만 링크가 된다.
const PERIODS=[
  {from:1, to:8,  name:'나라를 세우고 다지다', years:'918 – 1031',
   desc:'[[후삼국]]을 하나로 묶고, 북쪽의 [[거란]]과 맞서며 나라의 틀을 세운 때',
   events:[['918','[[왕건]]이 고려를 세움'],['936','후삼국 통일'],['958','첫 [[과거]]'],['993','[[서희]]의 담판'],['1019','[[귀주 대첩]]']]},
  {from:9, to:18, name:'큰 집안들의 나라',     years:'1031 – 1170',
   desc:'대대로 높은 벼슬을 이은 [[문벌]] 집안들이 왕 곁에서 나라를 움직인 때',
   events:[['1107','[[윤관]]의 [[여진]] 정벌'],['1126','[[이자겸의 난]]'],['1135','[[묘청]]의 난'],['1145','[[김부식]]의 『삼국사기』'],['1170','[[무신 정변]]']]},
  {from:19,to:24, name:'무신이 칼을 쥐다',     years:'1170 – 1274',
   desc:'[[무신]]들이 왕을 세우고 내쫓았고, [[몽골]]이 쳐들어온 때',
   events:[['1196','[[최충헌]]이 권력을 잡음'],['1231','몽골의 첫 침입'],['1232','[[강화도 천도]]'],['1251','[[팔만대장경]] 완성'],['1270','개경으로 돌아감 · [[삼별초]]']]},
  {from:25,to:30, name:'원의 그늘 아래',       years:'1274 – 1351',
   desc:'왕이 [[원나라]] 공주와 혼인해 [[부마국]]이 되고, 원의 간섭을 받은 때',
   events:[['1274 · 1281','[[일본 원정]]'],['1280','[[정동행성]]'],['','[[권문세족]]이 힘을 얻음']]},
  {from:31,to:34, name:'다시 일으키려 하다',   years:'1351 – 1392',
   desc:'원에서 벗어나려 나라를 고쳤지만, [[홍건적]]과 [[왜구]]에 시달리다 끝내 조선에 자리를 내준 때',
   events:[['1356','[[쌍성총관부]]를 되찾음'],['1366','[[신돈]]의 개혁'],['1388','[[이성계]]의 [[위화도 회군]]'],['1391','[[과전법]]'],['1392','[[정몽주]]의 죽음 · 조선 건국']]}
];
// 이 페이지의 낱말 풀이 — 본문의 [[낱말]]이 굵은 링크가 된다.
const GL={
  '후삼국':'신라가 약해진 뒤 후백제·후고구려·신라 셋으로 갈라졌던 때',
  '거란':'고려 북쪽 초원에 살던 민족. 요나라를 세우고 고려에 세 번 크게 쳐들어왔다',
  '왕건':'고려를 세운 태조. 936년 후삼국을 하나로 묶었다',
  '과거':'시험을 보아 관리를 뽑는 제도. 958년 광종 때 처음 열렸다',
  '서희':'993년 거란 장수 소손녕과 말로 담판해, 싸우지 않고 압록강 동쪽 땅(강동 6주)을 얻은 신하',
  '귀주 대첩':'1019년 강감찬이 귀주에서 돌아가던 거란군을 크게 무찌른 싸움',
  '문벌':'대대로 높은 벼슬을 이어 온 큰 집안',
  '윤관':'별무반이라는 군대를 이끌고 여진을 쳐 동북쪽에 아홉 성을 쌓은 신하',
  '여진':'고려 동북쪽에 살던 민족. 뒤에 금나라를 세웠다',
  '이자겸의 난':'1126년 인종의 외할아버지이자 장인이던 이자겸이 왕의 자리를 넘보며 일으킨 난',
  '묘청':'서경(평양)으로 서울을 옮기자고 하다가 1135년 서경에서 난을 일으킨 승려',
  '김부식':'묘청의 난을 누르고, 1145년 삼국의 역사책 『삼국사기』를 펴낸 신하',
  '무신 정변':'1170년 정중부 등 무신들이 문신을 죽이고 의종을 내쫓은 일',
  '무신':'군사 일을 맡은 신하. 글과 나랏일을 맡은 문신과 짝을 이룬다',
  '최충헌':'1196년 권력을 잡아, 4대 60여 년 이어진 최씨 무신 정권을 연 사람',
  '몽골':'초원에서 일어나 큰 제국을 세운 민족. 1231년부터 고려에 여러 번 쳐들어왔다',
  '강화도 천도':'1232년 몽골을 피해 서울을 개경에서 강화도로 옮긴 일',
  '팔만대장경':'몽골이 쳐들어온 때, 부처의 힘으로 나라를 지키려 16년에 걸쳐 새긴 불경 목판',
  '삼별초':'무신 정권의 군대. 1270년 개경으로 돌아가는 것에 맞서 진도·제주에서 싸웠다',
  '원나라':'몽골이 세운 나라. 1271년 나라 이름을 원으로 정했다',
  '부마국':'사위의 나라. 고려 왕이 원나라 공주와 혼인해 원 황제의 사위가 되었다',
  '일본 원정':'원나라가 고려의 군사와 배를 끌어다 1274년과 1281년 두 번 일본을 친 일. 두 번 다 실패했다',
  '정동행성':'원나라가 일본을 치려고 고려에 둔 관청. 원정이 끝난 뒤에도 남아 고려 일에 끼어들었다',
  '권문세족':'원나라와 가까워 큰 힘을 얻고 넓은 땅을 차지한 집안들',
  '홍건적':'원나라 말기 중국에서 일어난, 붉은 수건을 두른 무리. 두 번 고려에 쳐들어왔다',
  '왜구':'바닷가 마을을 노략질하던 일본 해적',
  '쌍성총관부':'원나라가 고려 동북쪽 땅에 둔 관청. 1356년 공민왕이 되찾았다',
  '신돈':'공민왕이 믿고 쓴 승려. 힘센 집안이 빼앗은 땅과 억울하게 종이 된 사람을 되돌리려 했다',
  '이성계':'홍건적과 왜구를 무찔러 이름을 얻은 장군. 1392년 조선을 세웠다',
  '위화도 회군':'1388년 요동을 치러 가던 이성계가 압록강 위화도에서 군사를 돌려 개경으로 돌아온 일',
  '과전법':'1391년 권문세족이 쥔 땅을 거두어 관리들에게 다시 나누어 준 법',
  '정몽주':'고려를 끝까지 지키려 한 신하. 1392년 이방원 쪽 사람들에게 죽임을 당했다'
};
const ROMAN=['Ⅰ','Ⅱ','Ⅲ','Ⅳ','Ⅴ'];

(async function renderGoryeo(){
  const main=document.getElementById('periods'), pnav=document.getElementById('pnav');
  let list=[];
  try{ list=await (await fetch('goryeo.json',{cache:'no-cache'})).json(); }catch(e){ return; }
  const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const gl=t=>esc(t).replace(/\[\[(.+?)\]\]/g,(m,w)=>GL[w]?'<span class="term" tabindex="0" role="button" data-term="'+w+'">'+w+'</span>':w);
  document.getElementById('st-kings').textContent=list.length;

  const card=k=>{
    const live=k.status==='live', cls='card'+(k.theme==='cold-iron'?' cold':'')+(live?'':' off');
    const inner='<span class="card-gen" aria-hidden="true">'+k.ep+'</span>'
      +'<div class="card-top">제'+k.ep+'대</div>'
      +'<div class="card-king">'+esc(k.korName)+'</div>'
      +'<div class="card-meta">'+esc(k.personalName)+' · 재위 '+esc(k.reign)+'</div>'
      +'<div class="card-tag">'+(live&&k.tagline?esc(k.tagline):'준비 중입니다')+'</div>'
      +(live?'<div class="card-go">이 왕이 되어 보기 →</div>':'');
    return live
      ? '<li><a class="'+cls+'" href="episode.html?goryeo='+k.ep+'">'+inner+'</a></li>'
      : '<li><div class="'+cls+'">'+inner+'</div></li>';
  };

  pnav.innerHTML=PERIODS.map((p,i)=>'<a class="pchip" href="#p'+(i+1)+'"><b>'+ROMAN[i]+'</b>'+p.name+'</a>').join('');
  main.innerHTML=PERIODS.map((p,i)=>{
    const kings=list.filter(k=>k.ep>=p.from&&k.ep<=p.to);
    return '<section class="period" id="p'+(i+1)+'">'
      +'<div class="p-head"><div class="p-no"><span>'+ROMAN[i]+'</span></div>'
      +'<div class="p-txt"><div class="p-years">'+p.years+' · '+p.from+'대 – '+p.to+'대</div>'
      +'<h2 class="p-name">'+p.name+'</h2><p class="p-desc">'+gl(p.desc)+'</p>'
      +'<ul class="p-events">'+p.events.map(e=>'<li>'+(e[0]?'<i>'+e[0]+'</i>':'')+gl(e[1])+'</li>').join('')+'</ul></div></div>'
      +'<ol class="grid">'+kings.map(card).join('')+'</ol></section>';
  }).join('');

  // 지금 보는 시기를 위쪽 칩에 표시
  const chips=[...pnav.querySelectorAll('.pchip')];
  const io=new IntersectionObserver(es=>{
    es.forEach(e=>{ if(e.isIntersecting){
      const n=+e.target.id.slice(1)-1;
      chips.forEach((c,j)=>c.classList.toggle('on',j===n));
      chips[n].scrollIntoView({block:'nearest',inline:'nearest'});
    }});
  },{rootMargin:'-45% 0px -50% 0px'});
  main.querySelectorAll('.period').forEach(s=>io.observe(s));
})();

// ─── 낱말 풀이 말풍선 ─────────────────────────────────────
(function(){
  const pop=document.createElement('div');
  pop.className='gloss-pop'; pop.setAttribute('role','tooltip');
  document.body.appendChild(pop);
  const hide=()=>{pop.classList.remove('on');pop.dataset.term='';};
  const show=t=>{
    const w=t.dataset.term;
    if(pop.classList.contains('on')&&pop.dataset.term===w){hide();return;}
    pop.innerHTML='<b></b><span></span>';
    pop.firstChild.textContent=w; pop.lastChild.textContent=GL[w]||'';
    pop.dataset.term=w; pop.classList.add('on');
    const r=t.getBoundingClientRect(), pw=pop.offsetWidth, ph=pop.offsetHeight;
    const vw=document.documentElement.clientWidth, vh=window.innerHeight;
    let top=r.bottom+8; if(top+ph>vh-8) top=Math.max(8,r.top-ph-8);
    pop.style.left=Math.min(Math.max(12,r.left+r.width/2-pw/2),vw-pw-12)+'px';
    pop.style.top=top+'px';
  };
  document.addEventListener('click',e=>{
    const t=e.target.closest&&e.target.closest('.term');
    if(t){e.preventDefault();show(t);} else if(!pop.contains(e.target)) hide();
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){hide();return;}
    const t=document.activeElement;
    if((e.key==='Enter'||e.key===' ')&&t&&t.classList&&t.classList.contains('term')){e.preventDefault();show(t);}
  });
  window.addEventListener('scroll',hide,{passive:true});
  window.addEventListener('resize',hide);
})();
</script>
</body>
