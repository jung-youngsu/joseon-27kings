<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>정도전 — 도면의 사람</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600;700&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">

<!-- theme: cold-iron -->
<style>
/* ═══════════════════════════════════════════════════════════════
   shared/themes/cold-iron.css
   톤: 차갑고 단단함 — 전쟁, 야망, 결단의 무게

   적합한 EP: 태조(이성계), 태종(이방원), 세조, 연산군 등
═══════════════════════════════════════════════════════════════ */

:root {
  --bg:  #0a0604;
  --bg2: #0f0906;
  --bg3: #140c08;

  --accent2: #8a5e1a;
  --accent3: #e0b060;

  --text:  #ece0d0;
  --text2: #c8b89a;
  --text3: #907860;

  --border:  #1e1408;
  --border2: #2e1e0c;
  --border3: #4e3418;

  --good2: #208848;
  --good3: #70f080;

  --bad2: #803020;
  --bad3: #f07060;

  --hist2: #3a2808;
  --hist3: #c09040;
}

</style>

<!-- shared/style.css -->
<style>
/* ═══════════════════════════════════════════════════════════════
   shared/style.css
   조선 27왕 시리즈 — 공통 스타일 (1층)

   원칙:
   - 구조, 레이아웃, 여백, 글꼴, 애니메이션은 여기서 정의
   - 색상은 변수(--var)로만 사용. 실제 색은 themes/*.css에서 정함
   - EP 고유 효과는 kings/ep??/style.css에서 추가
═══════════════════════════════════════════════════════════════ */

* { box-sizing: border-box; margin: 0; padding: 0; }

/* ── 변수 기본값 (themes에서 덮어씀) ────────────────────────── */
:root {
  /* 배경 3단계 */
  --bg:  #0a0604;
  --bg2: #0f0906;
  --bg3: #140c08;

  /* 강조색 (시대/막 표시, 진행바, 인용) */
  --accent2: #8a5e1a;
  --accent3: #e0b060;

  /* 텍스트 3단계 */
  --text:  #ece0d0;
  --text2: #c8b89a;
  --text3: #907860;

  /* 테두리 3단계 */
  --border:  #1e1408;
  --border2: #2e1e0c;
  --border3: #4e3418;

  /* 정답 (성취 색) */
  --good2: #208848;
  --good3: #70f080;

  /* 오답 (경고 색) */
  --bad2: #803020;
  --bad3: #f07060;

  /* 사료/원문 박스 */
  --hist2: #3a2808;
  --hist3: #c09040;

  /* 글꼴 */
  --font-serif: 'Noto Serif KR', serif;
  --font-sans:  'Noto Sans KR', sans-serif;
}

html { background: var(--bg); }
html, body { min-height: 100%; }
body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text);
  max-width: 640px;
  margin: 0 auto;
  min-height: 100vh;
}

/* ═══ 씬 시스템 ═══════════════════════════════════════════════
   .sc 는 한 씬. display:none/flex로만 전환.
   position:fixed 안 씀 → 창 크기와 무관하게 동작.
   min-height:100vh + overflow:visible → 짧으면 채우고 길면 스크롤.
═══════════════════════════════════════════════════════════════ */
.sc {
  display: none;
  flex-direction: column;
  min-height: 100vh;
  background: var(--bg);
  opacity: 0;
  transition: opacity 0.35s ease;
}
.sc.on { display: flex; opacity: 1; }

@keyframes fi    { from { opacity: 0; } to { opacity: 1; } }
@keyframes fi-up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

/* ═══ 진행바 ═══════════════════════════════════════════════ */
.prog {
  flex-shrink: 0;
  background: var(--bg);
  padding: 8px 20px 6px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  position: sticky;
  top: 0;
  z-index: 10;
}
.prog-bar {
  flex: 1;
  height: 2px;
  background: var(--border2);
  border-radius: 1px;
  overflow: hidden;
}
.prog-back {
  background: transparent;
  border: 1px solid var(--border3);
  color: var(--text3);
  width: 28px;
  height: 28px;
  border-radius: 50%;
  font-size: 14px;
  cursor: pointer;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .15s;
  font-family: var(--font-serif);
  line-height: 1;
}
.prog-back:hover {
  border-color: var(--accent3);
  color: var(--accent3);
  transform: translateX(-2px);
}
.prog-back-spacer {
  width: 28px;
  height: 28px;
}
.prog-fill {
  height: 100%;
  background: var(--accent2);
  transition: width .6s ease;
}

/* ═══ 상단 네비 — 점3개 메뉴 (평상시 숨김, 호버 시 확장) ═══════
   .top-nav 는 높이 0짜리 sticky 앵커. 실제 버튼(.nav-kebab)은
   그 위에 떠서 우상단 구석에 머문다. 평상시엔 점3개 + 현재 위치
   라벨만 흐릿하게 보이고, 호버/포커스하면 메뉴가 왼쪽(가로)으로 펼쳐진다.
   우상단에 고정(right:12px)된 채 폭이 늘어 빈 가로 공간을 채우므로
   글자끼리 겹치지 않고, 펼쳐져도 아래 콘텐츠를 밀지 않는다. */
.top-nav {
  position: sticky;
  top: 0;
  height: 0;
  overflow: visible;
  z-index: 30;
}
.nav-kebab {
  position: absolute;
  top: 6px;
  right: 12px;
  display: inline-flex;
  flex-direction: row-reverse;    /* 점은 오른쪽 구석, 메뉴는 왼쪽으로 */
  align-items: center;
  gap: 6px;
  padding: 5px 9px;
  border-radius: 13px;
  background: var(--bg);          /* 뒤 진행바 선을 가리되 페이지색과 섞임 */
  border: 1px solid transparent;
  color: var(--text3);            /* 평상시 흐릿 */
  cursor: pointer;
  outline: none;
  font-family: var(--font-sans);
  -webkit-tap-highlight-color: transparent;
  transition: background .2s ease, border-color .2s ease, color .2s ease;
}
.nav-kebab:hover,
.nav-kebab:focus-within {
  background: var(--bg2);
  border-color: var(--border3);
  color: var(--text2);
}
.nav-kebab-head {
  display: flex;
  flex-direction: row-reverse;    /* 점은 구석에, 라벨은 그 왼쪽 */
  align-items: center;
  gap: 8px;
}
.kebab-dots {
  display: inline-flex;
  flex-direction: column;
  gap: 2.5px;
  flex-shrink: 0;
}
.kebab-dots i {
  display: block;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: currentColor;
}
.nav-here {
  font-size: 11px;
  letter-spacing: 1px;
  white-space: nowrap;
  color: inherit;
}
/* 펼쳐지는 메뉴 — 평상시 접힘 */
.nav-menu {
  display: flex;
  flex-direction: row;            /* 가로 펼침 */
  align-items: center;
  gap: 4px;
  max-width: 0;
  opacity: 0;
  overflow: hidden;
  white-space: nowrap;
  transition: max-width .25s ease, opacity .2s ease;
}
.nav-kebab:hover .nav-menu,
.nav-kebab:focus-within .nav-menu {
  max-width: 340px;
  opacity: 1;
}
.nav-menu-ep {
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--text3);
  padding: 0 8px 0 2px;
  border-right: 1px solid var(--border2);
  margin-right: 2px;
  flex-shrink: 0;
}
.nav-menu a {
  display: block;
  padding: 6px 8px;
  font-size: 12px;
  letter-spacing: 1px;
  color: var(--text2);
  text-decoration: none;
  white-space: nowrap;
  border-radius: 7px;
  flex-shrink: 0;
  transition: background .15s ease, color .15s ease;
}
.nav-menu a:hover {
  background: var(--bg3);
  color: var(--accent3);
}
/* 모바일 — 가로 공간이 좁으면 세로 펼침으로 자동 전환 */
@media (max-width: 600px) {
  .nav-kebab { flex-direction: column; align-items: flex-end; gap: 0; }
  .nav-menu {
    flex-direction: column;
    align-items: flex-end;
    max-width: none;
    max-height: 0;
    transition: max-height .22s ease, opacity .2s ease, margin-top .2s ease;
  }
  .nav-kebab:hover .nav-menu,
  .nav-kebab:focus-within .nav-menu {
    max-width: none;
    max-height: 220px;
    margin-top: 8px;
  }
  .nav-menu-ep {
    border-right: none;
    border-bottom: 1px solid var(--border2);
    padding: 2px 8px 6px;
    margin: 0 0 2px;
  }
  .nav-menu a { width: 100%; text-align: right; padding: 7px 8px; }
}

/* ═══ 나레이션 씬 ═══════════════════════════════════════════ */
/* narration.svg 필드용 아트워크 컨테이너 (EP1 5막 실루엣 등) */
.narr-art {
  flex-shrink: 0;
  background: #060402;
  border-bottom: 1px solid var(--border);
}
.narr-art svg {
  width: 100%;
  display: block;
  max-height: 180px;
}

.narr-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  padding: 80px 28px 32px;
}
.narr-era {
  font-size: 11px;
  letter-spacing: 3px;
  color: var(--text3);
  margin-bottom: 18px;
}
.narr-text {
  font-family: var(--font-serif);
  font-size: 19px;
  line-height: 2.6;
  color: var(--text2);
  min-height: 200px;
}
.narr-text em {
  color: var(--text);
  font-style: normal;
  font-weight: 600;
}
.narr-text strong {
  color: var(--accent3);
  font-weight: 600;
}
.cursor {
  display: inline-block;
  width: 2px;
  height: 1em;
  background: var(--accent3);
  margin-left: 2px;
  vertical-align: text-bottom;
  animation: blink .7s step-end infinite;
}
.nav-area {
  flex-shrink: 0;
  padding: 16px 24px 32px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

/* ═══ 시대상황 씬 ═══════════════════════════════════════════ */
.context-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  padding: 50px 28px 32px;
}
.ctx-year {
  font-family: var(--font-serif);
  font-size: 52px;
  font-weight: 700;
  color: var(--accent2);
  line-height: 1;
  margin-bottom: 20px;
}
.ctx-title {
  font-family: var(--font-serif);
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 16px;
  letter-spacing: .5px;
}
.ctx-body {
  font-family: var(--font-serif);
  font-size: 14px;
  color: var(--text2);
  line-height: 2.3;
}
.ctx-body strong {
  color: var(--text);
  font-weight: 400;
}

/* ═══ 게임 씬 (대사 + 선택지) ═══════════════════════════════ */
.game-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 20px 24px 0;
}
.dial-wrap {
  display: flex;
  flex-direction: column;
  gap: 9px;
  margin-bottom: 16px;
}
.dial {
  border-radius: 6px;
  padding: 13px 16px;
  animation: fi-up .3s ease;
  background: var(--bg2);
  border: 1px solid var(--border2);
  border-left: 2px solid var(--text3);
}
/* 화자 종류별 좌측 막대 색 (themes에서 다르게 줄 수 있음) */
.dial.npc-a  { border-left-color: var(--accent3); }
.dial.npc-b  { border-left-color: var(--good3); }
.dial.npc-c  { border-left-color: #8870b0; }
.dial.king   { border-left-color: var(--accent2); background: var(--bg3); }
.dial.father { border-left-color: var(--hist3); }

.dial-who {
  font-size: 10px;
  letter-spacing: 2px;
  font-weight: 500;
  margin-bottom: 6px;
  color: var(--text3);
}
.dial.npc-a  .dial-who { color: var(--accent3); }
.dial.npc-b  .dial-who { color: var(--good3); }
.dial.npc-c  .dial-who { color: #9878b8; }
.dial.king   .dial-who { color: var(--accent3); }
.dial.father .dial-who { color: var(--hist3); }

.dial-text {
  font-family: var(--font-serif);
  font-size: 14px;
  color: var(--text);
  line-height: 2;
}

/* 게임 씬 안의 지문 — 말풍선이 아니라 그냥 글. 대사와 구별되어야 한다. */
.dial-narr {
  padding: 2px 2px 2px 0;
  font-family: var(--font-serif);
  font-size: 13.5px;
  color: var(--text2);
  line-height: 2.05;
  animation: fi .4s ease;
}
.dial-narr em     { color: var(--text); font-style: italic; }
.dial-narr strong { color: var(--text); font-weight: 600; }

/* 내면 독백 (방과의 시선) */
.inner-voice {
  margin: 0 0 14px;
  padding: 11px 15px;
  border-left: 2px solid var(--hist2);
  background: var(--bg2);
  font-family: var(--font-serif);
  font-size: 13px;
  color: var(--text3);
  line-height: 2.1;
  font-style: italic;
  animation: fi .4s ease;
}

/* ═══ 선택지 ═══════════════════════════════════════════════ */
.ch-area { padding: 16px 0 32px; }
.ch-label {
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 14px;
  font-family: var(--font-serif);
  letter-spacing: .3px;
  line-height: 1.6;
}
.ch-list {
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.ch {
  width: 100%;
  text-align: left;
  background: var(--bg2);
  border: 1px solid var(--border2);
  border-radius: 6px;
  padding: 13px 15px;
  color: var(--text2);
  font-family: var(--font-serif);
  font-size: 14px;
  line-height: 1.7;
  cursor: pointer;
  transition: all .15s;
}
.ch:hover:not(.locked):not(.blocked) {
  background: var(--bg3);
  border-color: var(--border3);
  color: var(--text);
}
.ch.locked {
  background: var(--hist2);
  border-color: var(--hist2);
  color: var(--hist3);
  cursor: default;
}
.ch.previously-chosen {
  border-left: 2px solid var(--accent3);
  background: var(--bg3);
  color: var(--text);
  position: relative;
}
.ch.previously-chosen::before {
  content: '✓';
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--accent3);
  font-size: 13px;
  opacity: 0.6;
}
.ch.blocked { opacity: .25; cursor: default; pointer-events: none; }
.ch.wrong-shake { animation: shake .35s ease; }

.block-msg {
  display: none;
  margin-top: 10px;
  padding: 10px 14px;
  background: var(--bg2);
  border: 1px solid var(--border3);
  border-radius: 5px;
  font-family: var(--font-serif);
  font-size: 13px;
  color: var(--text2);
  line-height: 1.8;
  animation: fi .3s ease;
}
.block-msg.on { display: block; }

/* "정답 없음" 막의 코멘트 */
.no-answer-msg {
  display: none;
  margin-top: 10px;
  padding: 12px 16px;
  background: var(--bg2);
  border: 1px solid var(--border3);
  border-radius: 5px;
  font-family: var(--font-serif);
  font-size: 13px;
  color: var(--text2);
  line-height: 2;
  animation: fi .3s ease;
}
.no-answer-msg.on { display: block; }
.no-answer-nav { display: none; margin-top: 12px; }
.no-answer-nav.on { display: flex; gap: 8px; }

/* 직접 쓰기 — 선택지 밖의 길 */
.ch.ch-free {
  margin-top: 7px;
  background: transparent;
  border-style: dashed;
  color: var(--text3);
}
.free-wrap { display: none; margin-top: 8px; animation: fi .3s ease; }
.free-wrap.on { display: block; }
.free-input {
  width: 100%;
  box-sizing: border-box;
  resize: vertical;
  min-height: 84px;
  padding: 12px 14px;
  background: var(--bg2);
  border: 1px solid var(--border3);
  border-radius: 6px;
  color: var(--text);
  font-family: var(--font-serif);
  font-size: 14px;
  line-height: 1.8;
}
.free-input:focus { outline: none; border-color: var(--accent2); }
.free-input::placeholder { color: var(--text3); }
.free-actions { display: flex; justify-content: flex-end; margin-top: 8px; }
.free-echo {
  margin-bottom: 10px;
  padding-left: 10px;
  border-left: 2px solid var(--accent3);
  color: var(--text);
}

/* 마지막 화면 — 당신의 선택 */
.mychoice-list { list-style: none; padding: 0; margin: 8px 0 18px; }
.mychoice {
  padding: 14px 0;
  border-bottom: 1px solid var(--border2);
  font-family: var(--font-serif);
}
.mychoice:last-child { border-bottom: none; }
.mychoice-act { font-size: 11px; letter-spacing: 2px; color: var(--accent3); margin-bottom: 6px; }
.mychoice-q { font-size: 13px; color: var(--text3); line-height: 1.7; margin-bottom: 6px; }
.mychoice-a { font-size: 15px; color: var(--text); line-height: 1.8; }
.mychoice-a.free { padding-left: 10px; border-left: 2px solid var(--accent3); }
.mychoice-mark { display: block; font-size: 11px; color: var(--accent3); letter-spacing: 1px; margin-bottom: 2px; }
.mychoice-none { color: var(--text3); font-style: italic; }
.mychoice-h { margin-top: 8px; font-size: 12.5px; color: var(--text2); line-height: 1.7; }

/* 마지막 화면 — 심화로 안내 */
.epi-next {
  margin-top: 28px;
  padding: 20px 18px;
  border: 1px solid var(--border3);
  border-radius: 8px;
  background: var(--bg2);
  text-align: center;
}
.epi-next-lead {
  font-family: var(--font-serif);
  font-size: 13.5px;
  color: var(--text2);
  line-height: 1.9;
  margin-bottom: 14px;
}

/* 노란 점 — 이미 정해진 결재 (단종편) */
.ch-dot {
  display: inline-block;
  width: 9px; height: 9px;
  margin-right: 8px;
  border-radius: 50%;
  background: #e2b93b;
  box-shadow: 0 0 0 2px rgba(226, 185, 59, .25);
  vertical-align: 1px;
}
.ch-markby { font-family: var(--font-serif); font-size: 12px; color: var(--text3); margin: -2px 0 8px; }
.ch.marked { border-color: rgba(226, 185, 59, .55); }
.ch.overruled { opacity: .55; text-decoration: line-through; text-decoration-color: var(--text3); }
.ch.beckon { animation: beckon 1.2s ease 2; }
@keyframes beckon {
  0%, 100% { box-shadow: 0 0 0 0 rgba(226, 185, 59, 0); }
  50% { box-shadow: 0 0 0 4px rgba(226, 185, 59, .35); }
}
/* 거꾸로 — 플레이어가 점을 찍는 결재 (세조편) */
.ch.stamped { border-color: rgba(226, 185, 59, .55); }
.stamp-dot { animation: stamp-in .5s ease; }
@keyframes stamp-in {
  0% { transform: scale(2.4); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}
.stamp-note { margin-top: 10px; font-family: var(--font-serif); font-size: 13px; color: var(--text2); }
/* 먼저 묻기 — 성종편 */

.ch.ask-skipped { opacity: .4; cursor: default; }
.ch.ask-absent { opacity: .35; cursor: default; border-style: dashed; text-decoration: line-through; text-decoration-thickness: 1px; }
.ask-answer:not(:empty) { margin-top: 12px; }
.ask-empty { font-family: var(--font-serif); font-size: 13px; color: var(--text2); padding: 10px 0; font-style: italic; }
.mychoice-ask { font-size: 11px; color: var(--text3); margin-top: 6px; letter-spacing: .5px; }

.erase-note { margin-top: 10px; font-family: var(--font-serif); font-size: 13px; color: var(--text2); }
.mychoice-a.wanted { color: var(--text3); margin-bottom: 8px; }
.mychoice-struck { text-decoration: line-through; text-decoration-color: var(--border3); }

  overflow: hidden;
  opacity: 0;
  transition: max-height 1.2s ease, opacity 1.2s ease;
  margin-top: 0;
}
.deep-reveal.on {
  max-height: 5000px;
  opacity: 1;
  margin-top: 24px;
}
.deep-divider {
  height: 1px;
  background: linear-gradient(to right, transparent, var(--border3), transparent);
  margin: 8px 0 24px;
}
.deep-reveal .nav-area {
  padding: 24px 0 0;
  margin-top: 8px;
}

  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 28px 24px;
}
.deep-tag {
  font-size: 11px;
  letter-spacing: 2px;
  font-weight: 500;
  margin-bottom: 10px;
  color: var(--accent3);
}
.deep-title {
  font-family: var(--font-serif);
  font-size: 17px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.5;
  margin-bottom: 14px;
}
.deep-text {
  font-family: var(--font-serif);
  font-size: 14px;
  color: var(--text2);
  line-height: 2.3;
}
.deep-text em { color: var(--text3); font-style: italic; }
.deep-quote {
  margin-top: 16px;
  padding: 12px 16px;
  border-left: 2px solid var(--accent2);
  background: var(--bg2);
  font-family: var(--font-serif);
  font-size: 13px;
  color: var(--accent3);
  line-height: 2;
  font-style: italic;
}

/* ═══ 오프닝 씬 ═══════════════════════════════════════════════ */
.opening {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 28px;
  text-align: center;
}

/* 순차 등장 베이스 */
.fade-target {
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 1s ease, transform 1s ease;
}
.fade-target.on {
  opacity: 1;
  transform: translateY(0);
}

.op-question {
  font-family: var(--font-serif);
  font-size: 18px;
  font-weight: 500;
  color: var(--text2);

}

  font-family: var(--font-serif);
  font-size: 64px;

  color: var(--accent2);

}
.op-series {
  font-size: 11px;
  color: var(--accent3);
  letter-spacing: 3px;
  margin-bottom: 36px;

  gap: 14px;
  margin-bottom: 36px;

.op-line-stacked {
  font-family: var(--font-serif);
  font-size: 15px;
  color: var(--text2);
  line-height: 2.0;

  transform: translateY(8px);

  text-align: center;

.op-line-stacked.on {
  opacity: 1;
  transform: translateY(0);
}
.op-line-stacked em {
  color: var(--accent3);
  font-style: normal;
}
.op-line-stacked strong {
  color: var(--text);
  font-weight: 600;
}

.op-start {
  margin-top: 8px;
}

.op-portal-wrap {
  width: 100px;
  height: 100px;
  margin: 0 auto 24px;
  position: relative;
}
.op-portal {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
.op-portal-ring-out {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 1.5px solid transparent;
  border-top-color: var(--accent2);
  border-right-color: var(--accent2);
  animation: spin 2s linear infinite;
}
.op-portal-ring-mid {
  position: absolute;
  inset: 14px;
  border-radius: 50%;
  border: 1px solid transparent;
  border-bottom-color: var(--accent3);
  border-left-color: var(--accent3);
  animation: spin 1.4s linear infinite reverse;

.op-glyph-in-portal {
  font-family: var(--font-serif);
  font-size: 36px;
  font-weight: 700;
  color: var(--accent3);
  line-height: 1;
  position: relative;
  z-index: 1;
}
@keyframes spin {
  from { transform: rotate(0); }
  to   { transform: rotate(360deg); }
}

.op-disc {
  font-size: 12px;
  color: var(--accent3);
  margin-top: 14px;
  line-height: 1.9;

  font-size: 14px;

  font-size: 14px;
  font-weight: 600;
  color: var(--accent3);
  line-height: 1.9;

.btn-p:hover { background: var(--bg3); border-color: var(--accent3); }

.btn-p.solid { background: var(--accent2); color: var(--bg); border-color: var(--accent2); }

.term {
  text-decoration: underline dotted;
  text-decoration-color: var(--accent3);

  text-decoration-thickness: 1.5px;
  cursor: pointer;
  border-radius: 2px;

.term:hover, .term:focus-visible {

.gloss-pop {
  position: fixed;
  z-index: 1000;
  left: 0; top: 0;

  font-style: normal;
  font-weight: 400;

.gloss-pop.on { opacity: 1; visibility: visible; pointer-events: auto; }
.gloss-pop b {
  display: block;
  margin-bottom: 2px;
  color: var(--accent3);
  font-family: var(--font-serif);
  font-weight: 600;

<!-- shared/engine.js -->
<script>
/* ═══════════════════════════════════════════════════════════════
   shared/engine.js
   조선 27왕 시리즈 — 게임 엔진

   역할:
   - scenes.json 데이터를 받아 게임을 화면에 그림
   - 씬 간 전환, 선택지 처리, 진행률 계산
   - 게임 종료 시 부모(episode.html)에게 신호 전송

   사용법:
   1. HTML에 빈 div 하나만 두면 됨: <div id="game-root"></div>
   2. window.GameEngine.start(scenesData) 호출
   3. 끝나면 자동으로 부모 프레임에 'game-complete' 메시지 발송
═══════════════════════════════════════════════════════════════ */

(function() {
  'use strict';

  // ─── 상태 ────────────────────────────────────────────────
  const state = {
    data: null,           // scenes.json 전체
    currentSceneIdx: 0,   // 현재 씬 인덱스
    flags: {},            // 학생의 선택 기록
    answers: {},          // 씬 인덱스 → { kind: 'option', idx } | { kind: 'free', text }
    wanted: {},
    asked: {},            // 먼저 묻기 씬에서 물은 사람 (씬 번호 → people 번호, 아무도 없으면 -1)           // 노란 점 씬에서 플레이어가 고르려 했던 것 (answers와 같은 모양)
    actsCompleted: [],    // 완료한 막 ID 목록
    lockedScenes: new Set(),  // 선택을 이미 한 씬 (뒤로가기 제한용)
    visitedScenes: new Set()  // 이미 본 씬 (타이핑 스킵용)
  };

  // ─── 엔진 시작 ───────────────────────────────────────────
  function start(scenesData) {
    state.data = scenesData;
    state.currentSceneIdx = 0;
    state.flags = {};
    state.answers = {};
    state.wanted = {};
    state.asked = {};
    state.actsCompleted = [];
    state.lockedScenes = new Set();
    state.visitedScenes = new Set();
    setupGlossary(scenesData.glossary);
    renderScene();
  }

  // ─── 현재 씬 렌더링 ─────────────────────────────────────
  function renderScene() {
    const scene = state.data.scenes[state.currentSceneIdx];
    if (!scene) {
      finish();
      return;
    }

    const root = document.getElementById('game-root');
    if (!root) {
      console.error('GameEngine: #game-root not found');
      return;
    }

    // 낱말 풀이 링크는 씬마다 처음 나올 때만
    glossSeen = new Set();
    hideGloss();

    // 모든 씬은 .sc 클래스로
    root.innerHTML = '';
    const el = document.createElement('div');
    el.className = 'sc';

    // 씬 타입별 처리
    switch (scene.type) {
      case 'opening':    renderOpening(el, scene);    break;
      case 'narration':  renderNarration(el, scene);  break;
      case 'context':    renderContext(el, scene);    break;
      case 'game':       renderGame(el, scene);       break;
      case 'deep':       renderDeep(el, scene);       break;
      case 'epilogue':   renderEpilogue(el, scene);   break;
      default:
        el.innerHTML = `<div style="padding:20px;color:#f80;">알 수 없는 씬 타입: ${scene.type}</div>`;
    }

    root.appendChild(el);
    requestAnimationFrame(() => el.classList.add('on'));

    // 진행바 업데이트
    updateProgress();

    // 뒤로가기 버튼 이벤트
    const backBtn = el.querySelector('#prog-back');
    if (backBtn) backBtn.onclick = goBack;

    // 이 씬을 방문 목록에 추가
    state.visitedScenes.add(state.currentSceneIdx);

    // 스크롤 맨 위로
    window.scrollTo(0, 0);
  }

  // ─── 씬 타입별 렌더 ────────────────────────────────────────

  function renderOpening(el, s) {
    const linesHTML = (s.lines || []).map((l, i) =>
      `<div class="op-line-stacked" data-i="${i}">${parseInline(l)}</div>`
    ).join('');

    // s.portal: true 면 glyph 자리에 회전 포탈 (EP1 환생씬 흡수용)
    const glyphOrPortalHTML = s.portal
      ? `<div class="op-portal-wrap fade-target" data-step="1">
           <div class="op-portal">
             <div class="op-portal-ring-out"></div>
             <div class="op-portal-ring-mid"></div>
             ${s.glyph ? `<div class="op-glyph-in-portal">${escapeHTML(s.glyph)}</div>` : ''}
           </div>
         </div>`
      : (s.glyph ? `<div class="op-glyph fade-target" data-step="1">${escapeHTML(s.glyph)}</div>` : '');

    el.innerHTML = `
      <div class="opening">
        ${s.question ? `<div class="op-question fade-target" data-step="0">${escapeHTML(s.question)}</div>` : ''}
        ${glyphOrPortalHTML}
        ${s.series ? `<div class="op-series fade-target" data-step="2">${escapeHTML(s.series)}</div>` : ''}
        ${linesHTML ? `<div class="op-lines">${linesHTML}</div>` : ''}
        <button class="btn-p solid op-start fade-target" data-step="9" id="op-next">시작 →</button>
      </div>
    `;

    // 순차 등장
    const targets = el.querySelectorAll('.fade-target');
    targets.forEach(t => {
      const step = parseInt(t.dataset.step);
      setTimeout(() => t.classList.add('on'), 200 + step * 600);
    });
    const linesEls = el.querySelectorAll('.op-line-stacked');
    linesEls.forEach((line, i) => {
      // glyph/question/series 다음에 lines가 한 줄씩
      setTimeout(() => line.classList.add('on'), 200 + (3 + i) * 600);
    });
    // 시작 버튼은 lines 다 끝난 다음
    const startBtn = el.querySelector('.op-start');
    if (startBtn) {
      const totalLines = linesEls.length;
      setTimeout(() => startBtn.classList.add('on'), 200 + (3 + totalLines + 1) * 600);
    }

    if (startBtn) startBtn.onclick = nextScene;
  }

  function renderNarration(el, s) {
    // s.svg: raw SVG 문자열을 본문 위 아트워크로 삽입 (EP1 5막 실루엣용)
    el.innerHTML = `
      ${headerNav()}
      ${progressBar()}
      ${s.svg ? `<div class="narr-art">${s.svg}</div>` : ''}
      <div class="narr-body">
        ${s.era ? `<div class="narr-era">${escapeHTML(s.era)}</div>` : ''}
        <div class="narr-text" id="narr-target"></div>
      </div>
      <div class="nav-area" id="narr-nav" style="display:none;">
        <button class="btn-p solid" id="narr-next">${getNextLabel()}</button>
      </div>
    `;
    el.querySelector('#narr-next').onclick = nextScene;

    const target = el.querySelector('#narr-target');
    const navEl = el.querySelector('#narr-nav');

    // 이미 본 씬이면 타이핑 스킵 — 즉시 전체 표시
    if (state.visitedScenes.has(state.currentSceneIdx)) {
      target.innerHTML = parseInline(s.text || '');
      navEl.style.display = '';
      navEl.classList.add('fade-target', 'on');
      return;
    }

    // 처음 보는 씬 — 타이핑 효과
    typeText(target, s.text || '', () => {
      navEl.style.display = '';
      navEl.classList.add('fade-target', 'on');
    });
  }

  // 타이핑 효과 (이성계편 방식)
  let typingTimers = [];
  let typingToken = 0;
  const TYPE_SPEED = 44;

  function typeText(el, rawText, onDone) {
    typingTimers.forEach(clearTimeout);
    typingTimers = [];
    typingToken++;
    const myToken = typingToken;

    // 인라인 마크업 미리 파싱 (그대로 두고 글자만 진행)
    // 단순화: 한 글자씩 보여주되, [em]...[/em] 같은 태그는 즉시 처리
    // 구현: parseInline 결과를 받고, HTML 그대로 저장한 다음 visible characters를 키움
    const parsed = parseInline(rawText);
    el.innerHTML = '';

    // HTML 태그를 보호하면서 텍스트만 한 글자씩 노출
    // 간단한 방식: 원본을 character 단위로 쪼개되 HTML 태그는 한 묶음으로
    const tokens = tokenizeForTyping(parsed);
    let i = 0;
    let html = '';

    function tick() {
      if (myToken !== typingToken) return;
      if (i >= tokens.length) {
        el.innerHTML = html.replace(/<span class="cursor"><\/span>$/, '');
        if (onDone) setTimeout(() => { if (myToken === typingToken) onDone(); }, 300);
        return;
      }
      const tok = tokens[i];
      // 커서 제거 후 추가
      html = html.replace(/<span class="cursor"><\/span>$/, '');
      html += tok + '<span class="cursor"></span>';
      el.innerHTML = html;
      i++;

      // 다음 글자 딜레이 결정
      let delay = TYPE_SPEED;
      const lastChar = tok.length === 1 ? tok : '';
      if (lastChar === '\n' || tok === '<br>') delay = TYPE_SPEED * 5;
      else if (lastChar === '.' || lastChar === '?' || lastChar === '!') delay = TYPE_SPEED * 4;
      else if (lastChar === ',') delay = TYPE_SPEED * 2;

      typingTimers.push(setTimeout(tick, delay));
    }
    tick();
  }

  // HTML 문자열을 타이핑용 토큰으로 쪼개기
  // <태그>는 한 묶음, 일반 글자는 하나씩
  function tokenizeForTyping(html) {
    const tokens = [];
    let i = 0;
    while (i < html.length) {
      if (html[i] === '<') {
        // 태그 끝까지 한 묶음
        const end = html.indexOf('>', i);
        if (end === -1) { tokens.push(html[i]); i++; }
        else { tokens.push(html.substring(i, end + 1)); i = end + 1; }
      } else if (html[i] === '&') {
        // HTML 엔티티 (&amp; 등)
        const end = html.indexOf(';', i);
        if (end === -1 || end - i > 6) { tokens.push(html[i]); i++; }
        else { tokens.push(html.substring(i, end + 1)); i = end + 1; }
      } else {
        tokens.push(html[i]);
        i++;
      }
    }
    return tokens;
  }

  function renderContext(el, s) {
    el.innerHTML = `
      ${headerNav()}
      ${progressBar()}
      <div class="context-body">
        ${s.year ? `<div class="ctx-year">${escapeHTML(s.year)}</div>` : ''}
        ${s.title ? `<div class="ctx-title">${escapeHTML(s.title)}</div>` : ''}
        ${s.body ? `<div class="ctx-body">${parseInline(s.body)}</div>` : ''}
      </div>
      <div class="nav-area">
        <button class="btn-p solid" id="ctx-next">${getNextLabel()}</button>
      </div>
    `;
    el.querySelector('#ctx-next').onclick = nextScene;
  }

  function renderGame(el, s) {
    let html = `
      ${headerNav()}
      ${progressBar()}
      <div class="game-body">
        <div class="dial-wrap">
    `;

    // 대사 목록
    (s.dialogues || []).forEach(d => {
      if (d.type === 'inner') {
        html += `<div class="inner-voice">${parseInline(d.text)}</div>`;
      } else if (d.type === 'narration') {
        // 게임 씬 안의 지문. 말풍선으로 그리면 익명 화자의 대사로 읽힌다.
        html += `<div class="dial-narr">${parseInline(d.text)}</div>`;
      } else {
        const cls = d.role || 'npc-a';
        html += `
          <div class="dial ${cls}">
            ${d.who ? `<div class="dial-who">${glossWho(d.who)}</div>` : ''}
            <div class="dial-text">${parseInline(d.text)}</div>
          </div>
        `;
      }
    });

    html += `</div>`;

    // 선택지
    if (s.choice) {
      html += `
        <div class="ch-area${hasAsk(s.choice) && askPeople(s.choice).length ? ' asking' : ''}">
          ${hasAsk(s.choice) ? renderAsk(s.choice) : ''}
          <div class="ch-label">${parseInline(s.choice.label || '')}</div>
          ${hasMark(s.choice) && s.choice.markBy ? `
          <div class="ch-markby"><span class="ch-dot"></span>${parseInline(s.choice.markBy)}</div>` : ''}
          ${!hasMark(s.choice) && s.choice.markNone ? `
          <div class="ch-markby"><span class="ch-dot erased"></span>${parseInline(s.choice.markNone)}</div>` : ''}
          <div class="ch-list" id="ch-list">
            ${s.choice.options.map((opt, i) => `
              <button class="ch${s.choice.mark === i ? ' marked' : ''}" data-idx="${i}">${
                s.choice.mark === i ? '<span class="ch-dot" aria-label="노란 점"></span>' : ''
              }${parseInline(opt.text, true)}</button>
            `).join('')}
          </div>
          ${allowsFree(s.choice) ? `
          <button class="ch ch-free" id="ch-free-open">✎ 다른 길이 있다 — 직접 쓰기</button>
          <div class="free-wrap" id="free-wrap">
            <textarea class="free-input" id="free-input" maxlength="300" rows="3"
              placeholder="당신이라면 어떻게 하겠습니까? 위에 없는 길을 적어 보세요."></textarea>
            <div class="free-actions">
              <button class="btn-p solid" id="free-submit">이 길로 간다 →</button>
            </div>
          </div>` : ''}
          <div class="block-msg" id="block-msg"></div>
          <div class="no-answer-msg" id="no-answer-msg"></div>
          <div class="no-answer-nav" id="no-answer-nav">
            <button class="btn-p solid" id="ch-next">${getNextLabel()}</button>
          </div>
        </div>
      `;
    }

    html += `</div>`;
    el.innerHTML = html;

    // 이미 선택한 씬으로 돌아온 경우 — 이전 선택을 표시하되 다시 선택 가능
    const wasLocked = state.lockedScenes.has(state.currentSceneIdx);
    const previousChoiceIdx = (s.choice && s.choice.flag) ? state.flags[s.choice.flag] : undefined;

    if (s.choice) {
      // 선택지 클릭 가능하게 바인딩
      el.querySelectorAll('.ch[data-idx]').forEach(btn => {
        btn.onclick = () => handleChoice(s, parseInt(btn.dataset.idx), btn, el);
      });

      bindFreeAnswer(s, el);
      bindAsk(s, el);

      // 이전 선택이 있으면 표시 (해당 버튼만 강조, 나머지는 그대로 클릭 가능)
      const prev = state.answers[state.currentSceneIdx];
      if (wasLocked && prev && prev.kind === 'free') {
        el.querySelector('#ch-free-open')?.classList.add('previously-chosen');
      } else if (wasLocked && previousChoiceIdx !== undefined) {
        const prevBtn = el.querySelectorAll('.ch[data-idx]')[previousChoiceIdx];
        if (prevBtn) prevBtn.classList.add('previously-chosen');
        showStamp(s.choice, previousChoiceIdx, el);
        showErase(s.choice, previousChoiceIdx, el);
      }
    } else {
      // 선택지 없는 게임 씬 — 자동 다음
      const navArea = document.createElement('div');
      navArea.className = 'nav-area';
      navArea.innerHTML = `<button class="btn-p solid" id="game-next">${getNextLabel()}</button>`;
      el.appendChild(navArea);
      el.querySelector('#game-next').onclick = nextScene;
    }
  }

  function renderDeep(el, s) {
    el.innerHTML = `
      ${headerNav()}
      ${progressBar()}
      <div class="deep-body">
        ${s.tag ? `<div class="deep-tag">${escapeHTML(s.tag)}</div>` : ''}
        ${s.title ? `<div class="deep-title">${parseInline(s.title)}</div>` : ''}
        ${s.text ? `<div class="deep-text">${parseInline(s.text)}</div>` : ''}
        ${s.quote ? `<div class="deep-quote">${parseInline(s.quote)}</div>` : ''}
      </div>
      <div class="nav-area">
        <button class="btn-p solid" id="deep-next">${getNextLabel()}</button>
      </div>
    `;
    el.querySelector('#deep-next').onclick = () => {
      // 막 완료 기록
      if (s.actId) state.actsCompleted.push(s.actId);
      nextScene();
    };
  }

  function renderEpilogue(el, s) {
    el.innerHTML = `
      ${headerNav()}
      ${progressBar()}
      <div class="epi-body">
        ${s.year ? `<div class="epi-year">${escapeHTML(s.year)}</div>` : ''}
        ${s.title ? `<div class="epi-big">${parseInline(s.title)}</div>` : ''}
        ${(s.paragraphs || []).map(p => `<div class="epi-text">${parseInline(p)}</div>`).join('')}
        ${s.quote ? `<div class="epi-quote">${parseInline(s.quote)}</div>` : ''}
      </div>
      <div class="nav-area">
        <button class="btn-p solid" id="epi-next">완료 →</button>
      </div>
    `;
    el.querySelector('#epi-next').onclick = finish;
  }

  // ─── 선택지 처리 ────────────────────────────────────────
  function handleChoice(scene, idx, btn, sceneEl) {
    const opt = scene.choice.options[idx];

    // "정답 없음" 모드 — 어떤 선택이든 코멘트 보여주고 진행
    if (scene.choice.type === 'reflection') {
      // 노란 점이 찍힌 결재 — 다른 쪽을 고르면 붓이 점으로 되돌아간다
      if (hasMark(scene.choice) && !scene.choice.erasable && idx !== scene.choice.mark) {
        overrule(scene, { kind: 'option', idx }, opt.overrule, btn, sceneEl);
        return;
      }

      // 이 씬은 선택했음 (뒤로 와도 표시되도록)
      state.lockedScenes.add(state.currentSceneIdx);

      // 다른 버튼 잠금은 안 함 (자유 탐색) — 다만 이전 강조 제거하고 새 강조
      sceneEl.querySelectorAll('.ch').forEach(b => {
        b.classList.remove('locked', 'previously-chosen');
      });
      btn.classList.add('locked');

      // 선택의 결과 메시지
      const msgEl = sceneEl.querySelector('#no-answer-msg');
      if (msgEl) {
        // [b]/[em] 같은 인라인 마크업이 그대로 보이지 않게 파싱해서 넣는다
        msgEl.innerHTML = parseInline(opt.feedback || '당신의 선택이 기록되었습니다.') +
          (isStamp(scene.choice, idx) ? `<div class="stamp-note"><span class="ch-dot"></span>${parseInline(scene.choice.stamp)}</div>` : '') +
          (isErased(scene.choice, idx) ? eraseNote(scene.choice) : '');
        msgEl.classList.add('on');
      }
      showStamp(scene.choice, idx, sceneEl);
      showErase(scene.choice, idx, sceneEl);

      // flag 기록
      if (scene.choice.flag) {
        state.flags[scene.choice.flag] = idx;
      }
      state.answers[state.currentSceneIdx] = { kind: 'option', idx };
      sceneEl.querySelector('#free-wrap')?.classList.remove('on');

      // 다음 버튼 표시 (라벨 동적)
      const navEl = sceneEl.querySelector('#no-answer-nav');
      if (navEl) navEl.classList.add('on');

      const nextBtn = sceneEl.querySelector('#ch-next');
      if (nextBtn) {
        nextBtn.textContent = getNextLabel();
        nextBtn.onclick = () => {
          if (opt.jumpTo !== undefined) {
            jumpToScene(opt.jumpTo);
          } else {
            nextScene();
          }
        };
      }
      return;
    }

    // "정답 있음" 모드 — 오답이면 흔들기
    if (opt.correct === false) {
      btn.classList.add('wrong-shake');
      setTimeout(() => btn.classList.remove('wrong-shake'), 400);

      const msgEl = sceneEl.querySelector('#block-msg');
      msgEl.innerHTML = parseInline(opt.blockMessage || '다시 생각해보세요.');
      msgEl.classList.add('on');
      return;
    }

    // 정답 처리
    state.lockedScenes.add(state.currentSceneIdx);

    // 다른 버튼 잠금 안 함 - 다시 시도 가능. 다만 이전 강조 정리.
    sceneEl.querySelectorAll('.ch').forEach(b => {
      b.classList.remove('locked', 'previously-chosen');
    });
    btn.classList.add('locked');

    // block-msg 숨기기
    const blockMsg = sceneEl.querySelector('#block-msg');
    if (blockMsg) blockMsg.classList.remove('on');

    if (scene.choice.flag) {
      state.flags[scene.choice.flag] = idx;
    }

    // 점프가 있으면 (분기 입구 같은 곳)
    if (opt.jumpTo !== undefined) {
      let navEl = sceneEl.querySelector('#no-answer-nav');
      if (!navEl) {
        const chArea = sceneEl.querySelector('.ch-area');
        if (chArea) {
          const newNav = document.createElement('div');
          newNav.className = 'no-answer-nav on';
          newNav.id = 'no-answer-nav';
          newNav.innerHTML = `<button class="btn-p solid" id="ch-next">다음 →</button>`;
          chArea.appendChild(newNav);
        }
      } else {
        navEl.classList.add('on');
      }
      const nextBtn = sceneEl.querySelector('#ch-next');
      if (nextBtn) nextBtn.onclick = () => jumpToScene(opt.jumpTo);
      return;
    }

    // 정답 후 — 다음 버튼 표시 (라벨 동적)
    let navEl = sceneEl.querySelector('#no-answer-nav');
    if (!navEl) {
      // 정답 모드에선 원래 nav 영역이 없으니 추가
      const chArea = sceneEl.querySelector('.ch-area');
      if (chArea) {
        const newNav = document.createElement('div');
        newNav.className = 'no-answer-nav on';
        newNav.id = 'no-answer-nav';
        newNav.innerHTML = `<button class="btn-p solid" id="ch-next">${getNextLabel()}</button>`;
        chArea.appendChild(newNav);
      }
    } else {
      navEl.classList.add('on');
      const existingBtn = navEl.querySelector('#ch-next');
      if (existingBtn) existingBtn.textContent = getNextLabel();
    }

    const nextBtn = sceneEl.querySelector('#ch-next');
    if (nextBtn) {
      nextBtn.onclick = () => nextScene();
    }
  }

  // ─── 직접 쓰기 ──────────────────────────────────────────
  // 이 게임의 선택지는 일부러 좁다. 그 왕이 실제로 낸 길은 선택지에 없다.
  // 그 길을 선택지에 넣으면 선택지가 의미를 잃으므로, 대신 플레이어가
  // 선택지 밖의 길을 직접 적을 수 있게 한다. choice.freeText: false 로 끈다.
  function allowsFree(choice) {
    return choice && choice.type === 'reflection' && choice.freeText !== false;
  }

  // ─── 노란 점 ────────────────────────────────────────────
  // 어린 왕(단종)의 결재처럼, 고를 것이 이미 정해져 있는 씬.
  // choice.mark = 점이 찍힌 선택지 번호, choice.markBy = 누가 찍었나.
  // 다른 쪽을 고르거나 직접 써도 기록만 되고(state.wanted), 진행은 점을 따라야 한다.
  // choice.markNone = 점이 없는 결재(명종편 4막). 빈 동그라미와 그 문구만 보여 주고, 고르는 것은 막지 않는다.
  function hasMark(choice) {
    return !!choice && Number.isInteger(choice.mark);
  }

  // 거꾸로 — 플레이어가 노란 점을 찍는 쪽인 씬(세조편).
  // choice.stamp = 점이 누구 앞에 놓이는지, opt.stamp: true = 그 갈래를 고르면 점이 찍힌다.
  function isStamp(choice, idx) {
    return !!(choice && choice.stamp && choice.options[idx] && choice.options[idx].stamp);
  }

  function showStamp(choice, idx, sceneEl) {
    if (!choice || !choice.stamp) return;
    sceneEl.querySelectorAll('.ch[data-idx]').forEach(b => {
      b.classList.remove('stamped');
      b.querySelector('.ch-dot.stamp-dot')?.remove();
    });
    if (!isStamp(choice, idx)) return;
    const btn = sceneEl.querySelector(`.ch[data-idx="${idx}"]`);
    if (!btn) return;
    btn.classList.add('stamped');
    btn.insertAdjacentHTML('afterbegin', '<span class="ch-dot stamp-dot" aria-label="당신이 찍은 노란 점"></span>');
  }

  // 지울 수 있는 점 — 점은 찍혀 오지만, 다른 쪽을 골라도 막지 않는다(예종편).
  // choice.erasable: true, choice.eraseNote = 점을 지웠을 때 따라오는 값.
  function isErased(choice, idx) {
    return !!(choice && choice.erasable && hasMark(choice) && idx !== choice.mark);
  }

  function eraseNote(choice) {
    return `<div class="erase-note"><span class="ch-dot erased"></span>${parseInline(choice.eraseNote || '당신은 노란 점을 지웠습니다.')}</div>`;
  }

  function showErase(choice, idx, sceneEl) {
    if (!choice || !choice.erasable) return;
    const dot = sceneEl.querySelector(`.ch[data-idx="${choice.mark}"] .ch-dot`);
    if (dot) dot.classList.toggle('erased', isErased(choice, idx));
  }

  // ─── 먼저 묻기 ──────────────────────────────────────────
  // 경연처럼, 결정하기 전에 한 사람에게 묻는다(성종편).
  // choice.ask = { label, people: [{ who, role, says, hint?, key? }], emptyNote }
  // people이 비어 있으면 물을 사람이 없다는 것만 보여 주고 바로 고르게 한다.
  // people[].absent: true — 있지만 부르지 않은 사람(중종편). 흐리게 보이고 물을 수 없다. 그 아래 ask.absentNote.
  function hasAsk(choice) {
    return !!(choice && choice.ask);
  }

  function askPeople(choice) {
    return (choice && choice.ask && choice.ask.people) || [];
  }

  function renderAsk(choice) {
    const people = askPeople(choice);
    return `
          <div class="ask-area">
            <div class="ask-label">${parseInline(choice.ask.label || '결정하기 전에 — 누구에게 묻겠습니까?')}</div>
            ${people.length ? `
            <div class="ch-list ask-list">
              ${people.map((p, i) => p.absent
                ? `<button class="ch ask ask-absent" disabled>${escapeHTML(p.who)}</button>`
                : `<button class="ch ask" data-ask="${i}">${escapeHTML(p.who)}${
                p.hint ? `<span class="ask-hint">${parseInline(p.hint, true)}</span>` : ''}</button>`).join('')}
            </div>
            ${choice.ask.absentNote && people.some(p => p.absent) ? `<div class="ask-empty">${parseInline(choice.ask.absentNote)}</div>` : ''}` : `<div class="ask-empty">${parseInline(choice.ask.emptyNote || '물을 사람이 없습니다.')}</div>`}
            <div class="ask-answer" id="ask-answer"></div>
          </div>`;
  }

  function bindAsk(scene, sceneEl) {
    if (!hasAsk(scene.choice)) return;
    const people = askPeople(scene.choice);
    if (!people.length) { state.asked[state.currentSceneIdx] = -1; return; }
    sceneEl.querySelectorAll('.ch[data-ask]').forEach(btn => {
      btn.onclick = () => {
        if (state.asked[state.currentSceneIdx] !== undefined) return;  // 한 사람에게만 묻는다
        state.asked[state.currentSceneIdx] = parseInt(btn.dataset.ask);
        showAsked(scene, sceneEl);
      };
    });
    if (state.asked[state.currentSceneIdx] !== undefined) showAsked(scene, sceneEl);
  }

  function showAsked(scene, sceneEl) {
    const i = state.asked[state.currentSceneIdx];
    const p = askPeople(scene.choice)[i];
    if (!p) return;
    sceneEl.querySelectorAll('.ch[data-ask]').forEach(b => {
      const mine = parseInt(b.dataset.ask) === i;
      b.classList.toggle('locked', mine);
      b.classList.toggle('ask-skipped', !mine);
      b.disabled = true;
    });
    const ans = sceneEl.querySelector('#ask-answer');
    if (ans) ans.innerHTML = `
      <div class="dial ${p.role || 'npc-a'}">
        <div class="dial-who">${glossWho(p.who)}</div>
        <div class="dial-text">${parseInline(p.says || '')}</div>
      </div>`;
    sceneEl.querySelector('.ch-area')?.classList.remove('asking');
  }

  function overrule(scene, wanted, message, btn, sceneEl) {
    state.wanted[state.currentSceneIdx] = wanted;

    sceneEl.querySelectorAll('.ch').forEach(b => b.classList.remove('locked', 'previously-chosen'));
    if (btn) {
      btn.classList.add('overruled', 'wrong-shake');
      setTimeout(() => btn.classList.remove('wrong-shake'), 400);
    }
    const marked = sceneEl.querySelector(`.ch[data-idx="${scene.choice.mark}"]`);
    if (marked) {
      marked.classList.remove('beckon');
      void marked.offsetWidth;  // 애니메이션을 다시 시작
      marked.classList.add('beckon');
    }

    const msgEl = sceneEl.querySelector('#no-answer-msg');
    if (msgEl) {
      const echo = wanted.kind === 'free'
        ? `<div class="free-echo">${escapeHTML(wanted.text).replace(/\n/g, '<br>')}</div>` : '';
      msgEl.innerHTML = echo + parseInline(message || scene.choice.overrule ||
        '붓이 그쪽으로 가지 않습니다.\n[b]노란 점[/b]이 찍힌 곳에 이름을 적어야 합니다.');
      msgEl.classList.add('on');
    }
    sceneEl.querySelector('#no-answer-nav')?.classList.remove('on');
  }

  function bindFreeAnswer(scene, sceneEl) {
    const openBtn = sceneEl.querySelector('#ch-free-open');
    const wrap = sceneEl.querySelector('#free-wrap');
    const input = sceneEl.querySelector('#free-input');
    const submit = sceneEl.querySelector('#free-submit');
    if (!openBtn || !wrap || !input || !submit) return;

    const prev = state.answers[state.currentSceneIdx];
    if (prev && prev.kind === 'free') input.value = prev.text;

    openBtn.onclick = () => {
      wrap.classList.add('on');
      input.focus();
    };
    submit.onclick = () => {
      const text = input.value.trim();
      if (!text) { input.focus(); return; }

      if (hasMark(scene.choice) && !scene.choice.erasable) {
        wrap.classList.remove('on');
        overrule(scene, { kind: 'free', text }, scene.choice.freeFeedback, openBtn, sceneEl);
        return;
      }

      state.lockedScenes.add(state.currentSceneIdx);
      state.answers[state.currentSceneIdx] = { kind: 'free', text };
      if (scene.choice.flag) state.flags[scene.choice.flag] = 'free';

      sceneEl.querySelectorAll('.ch').forEach(b => b.classList.remove('locked', 'previously-chosen'));
      openBtn.classList.add('locked');
      wrap.classList.remove('on');
      showStamp(scene.choice, -1, sceneEl);
      showErase(scene.choice, 'free', sceneEl);

      const msgEl = sceneEl.querySelector('#no-answer-msg');
      if (msgEl) {
        msgEl.innerHTML =
          `<div class="free-echo">${escapeHTML(text).replace(/\n/g, '<br>')}</div>` +
          parseInline(scene.choice.freeFeedback ||
            '당신이 낸 길을 적어 두었습니다.\n이제 [b]그가 실제로 걸은 길[/b]과 견주어 보세요.') +
          (isErased(scene.choice, 'free') ? eraseNote(scene.choice) : '');
        msgEl.classList.add('on');
      }

      const navEl = sceneEl.querySelector('#no-answer-nav');
      if (navEl) navEl.classList.add('on');
      const nextBtn = sceneEl.querySelector('#ch-next');
      if (nextBtn) {
        nextBtn.textContent = getNextLabel();
        nextBtn.onclick = nextScene;
      }
    };
  }

  // ─── 씬 이동 ────────────────────────────────────────────
  function nextScene() {
    state.currentSceneIdx++;
    renderScene();
  }

  function jumpToScene(idx) {
    state.currentSceneIdx = idx;
    renderScene();
  }

  // ─── 게임 종료 ──────────────────────────────────────────
  function finish() {
    // 부모 프레임(episode.html)에 종료 신호
    try {
      window.parent.postMessage({
        type: 'game-complete',
        ep: state.data.ep,
        flags: state.flags,
        answers: summarizeAnswers().map(a => ({ act: a.act, question: a.question, answer: a.answerText, free: a.free, wanted: a.wantedText || undefined })),
        actsCompleted: state.actsCompleted,
        timestamp: Date.now()
      }, '*');
    } catch (e) {
      console.warn('postMessage failed', e);
    }

    // 최종 화면 — 플레이어가 막마다 고른 길을 한 장으로 돌려준다
    const rows = summarizeAnswers();
    const list = rows.map(r => `
      <li class="mychoice">
        ${r.act ? `<div class="mychoice-act">${escapeHTML(r.act)}</div>` : ''}
        <div class="mychoice-q">${parseInline(r.question)}</div>
        ${r.wantedHTML ? `
        <div class="mychoice-a wanted">
          <span class="mychoice-mark">당신이 고르고 싶었던 것</span>
          <span class="mychoice-struck">${r.wantedHTML}</span>
        </div>` : ''}
        <div class="mychoice-a${r.free ? ' free' : ''}">
          ${r.free ? '<span class="mychoice-mark">✎ 직접 쓴 길</span>' : ''}
          ${r.stamped ? '<span class="mychoice-mark"><span class="ch-dot"></span>당신이 노란 점을 찍은 것</span>' : ''}
          ${r.erasable ? `<span class="mychoice-mark"><span class="ch-dot${r.erased ? ' erased' : ''}"></span>${r.erased ? '노란 점을 지우고 고른 것' : '노란 점을 그대로 따랐습니다'}</span>` : ''}
          ${r.marked ? `<span class="mychoice-mark"><span class="ch-dot"></span>${r.wantedHTML ? '실제로 결재한 것' : '노란 점을 그대로 따랐습니다'}</span>` : ''}
          ${r.answerHTML}
        </div>
        ${r.askable ? `<div class="mychoice-ask">${r.askedWho ? `물은 사람 · ${escapeHTML(r.askedWho)}` : (r.askedNone ? '물을 사람이 없었습니다' : '아무에게도 묻지 않았습니다')}</div>` : ''}
        ${r.history ? `<div class="mychoice-h">깊게 살펴보기 「${parseInline(r.history)}」</div>` : ''}
      </li>`).join('');
    const freeCount = rows.filter(r => r.free).length;
    const markedCount = rows.filter(r => r.marked).length;
    const wantedCount = rows.filter(r => r.wantedHTML).length;
    const stampCount = rows.filter(r => r.stamped).length;
    const stampTotal = rows.filter(r => r.stampable).length;
    const eraseTotal = rows.filter(r => r.erasable).length;
    const erasedCount = rows.filter(r => r.erased).length;
    const askTally = {};
    rows.forEach(r => {
      if (!r.askedKey) return;
      askTally[r.askedKey] = askTally[r.askedKey] || { who: r.askedGroup, n: 0 };
      askTally[r.askedKey].n++;
    });
    const askTop = Object.values(askTally).sort((a, b) => b.n - a.n);
    const askBest = askTop.length ? askTop.filter(t => t.n === askTop[0].n) : [];

    // episode.html 안에서 돌 때만 심화 탭으로 넘겨줄 수 있다
    const framed = window.parent && window.parent !== window;

    const root = document.getElementById('game-root');
    root.innerHTML = `
      <div class="sc on">
        ${headerNav()}
        <div class="epi-body mychoice-body">
          <div class="epi-year">${escapeHTML(state.data.title || '')}</div>
          <div class="epi-big">당신의 선택은 이러했습니다</div>
          ${rows.length ? `<ol class="mychoice-list">${list}</ol>` : ''}
          ${freeCount ? `<div class="epi-text">${rows.length}번의 갈림길 가운데 ${freeCount}번, 당신은 주어진 선택지 밖에서 길을 찾았습니다.</div>` : ''}
          ${markedCount ? `<div class="epi-text">${markedCount}번의 결재에서, 붓은 언제나 노란 점을 따라갔습니다.${
            wantedCount ? `<br>당신은 그중 ${wantedCount}번, 다른 길을 원했습니다.` : ''}</div>` : ''}
          ${askBest.length ? `<div class="epi-text">${parseInline(askSummary(askBest))}</div>` : ''}
          ${eraseTotal ? `<div class="epi-text">${erasedCount
            ? parseInline((state.data.eraseLine || '{total}번의 결재 가운데 {n}번, 당신은 [b]노란 점을 지웠습니다.[/b]').replace('{n}', erasedCount).replace('{total}', eraseTotal))
            : parseInline((state.data.keepLine || '{total}번의 결재에서, 당신은 한 번도 노란 점을 지우지 않았습니다.').replace('{total}', eraseTotal))}</div>` : ''}
          ${stampTotal ? `<div class="epi-text">${stampCount
            ? parseInline((state.data.stampLine || '{n}번, 당신의 뜻이 [b]남의 붓 앞에 노란 점으로[/b] 놓였습니다.').replace('{n}', stampCount))
            : parseInline(state.data.noStampLine || '당신은 한 번도 노란 점을 찍지 않았습니다.')}</div>` : ''}
          ${framed ? `
          <div class="epi-next">
            <div class="epi-next-lead">게임은 여기까지입니다.<br>게임이 일부러 비워 둔 이야기가 심화에 있습니다.</div>
            <button class="btn-p solid" id="go-study">심화 읽으러 가기 →</button>
          </div>` : ''}
          <div class="nav-area" style="justify-content:center;margin-top:${framed ? 10 : 24}px;">
            <button class="btn-p" onclick="GameEngine.restart()">↺ 처음부터 다시</button>
          </div>
        </div>
      </div>
    `;
    const goStudy = document.getElementById('go-study');
    if (goStudy) goStudy.onclick = () => {
      try { window.parent.postMessage({ type: 'goto-tab', tab: 'study' }, '*'); } catch (e) {}
    };
    window.scrollTo(0, 0);
  }

  // 막마다 [질문 · 내 답 · 그 막의 깊게 살펴보기 제목]을 모은다.
  // 가장 많이 물은 사람. 모두 한 번씩이면 "막마다 다른 사람"으로 적는다.
  function askSummary(best) {
    const line = state.data.askLine || '당신이 가장 많이 물은 사람 — [b]{who}[/b] ({n}번)';
    if (best[0].n === 1 && best.length > 1) {
      return line.replace(' ({n}번)', '').replace('{who}', '막마다 다른 사람');
    }
    return line.replace('{who}', best.map(t => t.who).join(' · ')).replace('{n}', best[0].n);
  }

  function summarizeAnswers() {
    const scenes = state.data.scenes;
    const rows = [];
    scenes.forEach((s, i) => {
      if (s.type !== 'game' || !s.choice) return;
      const a = state.answers[i];
      const deep = scenes.slice(i + 1).find(x => x.type === 'deep' || x.type === 'game');
      const row = {
        act: (s.progLabel || '').trim(),
        question: s.choice.label || '',
        history: deep && deep.type === 'deep' ? deep.title : '',
        free: !!(a && a.kind === 'free'),
        marked: hasMark(s.choice) && !s.choice.erasable,
        erasable: hasMark(s.choice) && !!s.choice.erasable,
        erased: !!(a && isErased(s.choice, a.kind === 'free' ? 'free' : a.idx)),
        stamped: !!(a && a.kind === 'option' && isStamp(s.choice, a.idx)),
        stampable: !!(s.choice.stamp),
        askable: hasAsk(s.choice),
        askedWho: '',
        askedKey: '',
        wantedHTML: '',
        wantedText: '',
      };
      if (row.askable) {
        const ai = state.asked[i];
        const p = ai >= 0 ? askPeople(s.choice)[ai] : null;
        row.askedWho = p ? p.who : '';
        row.askedKey = p ? (p.key || p.who) : '';
        row.askedGroup = p ? (p.group || p.who) : '';  // 같은 key의 여러 사람을 한 이름으로 셀 때
        row.askedNone = ai === -1;
      }
      const w = state.wanted[i];
      if (row.marked && w) {
        if (w.kind === 'free') {
          row.wantedText = w.text;
          row.wantedHTML = escapeHTML(w.text).replace(/\n/g, '<br>');
        } else {
          const wo = s.choice.options[w.idx] || {};
          row.wantedText = String(wo.text || '').replace(/\[\/?[a-z]+\]/g, '');
          row.wantedHTML = parseInline(wo.text || '');
        }
      }
      if (!a) {
        row.answerText = '';
        row.answerHTML = '<span class="mychoice-none">고르지 않고 지나갔습니다</span>';
      } else if (a.kind === 'free') {
        row.answerText = a.text;
        row.answerHTML = escapeHTML(a.text).replace(/\n/g, '<br>');
      } else {
        const opt = s.choice.options[a.idx] || {};
        row.answerText = String(opt.text || '').replace(/\[\/?[a-z]+\]/g, '');
        row.answerHTML = parseInline(opt.text || '');
      }
      rows.push(row);
    });
    return rows;
  }

  function restart() {
    state.currentSceneIdx = 0;
    state.flags = {};
    state.answers = {};
    state.wanted = {};
    state.asked = {};
    state.actsCompleted = [];
    state.lockedScenes = new Set();
    renderScene();
  }

  // ─── 진행바 ─────────────────────────────────────────────
  function updateProgress() {
    const fill = document.querySelector('.prog-fill');
    if (!fill) return;
    const total = state.data.scenes.length;
    const cur = state.currentSceneIdx + 1;
    fill.style.width = (cur / total * 100) + '%';
  }

  // ─── 헤더 네비 (점3개 메뉴 — 평상시 숨김, 호버 시 확장) ─────
  // 구석(우상단)에 점3개 + 현재 위치 라벨만 둔다.
  // 호버/포커스하면 홈·시리즈 링크가 아래로 펼쳐진다.
  function headerNav() {
    // episode.html 등 프레임(iframe) 안에서 실행되면 프레임이 자체 메뉴를
    // 제공하므로 게임 내부 메뉴는 숨긴다(중복 방지). 단독으로 game.html을
    // 직접 열었을 때만 점3개 메뉴를 그린다.
    try { if (window.self !== window.top) return ''; } catch (e) { return ''; }
    const ep = state.data.ep || '';
    const epLabel = 'EP' + (ep < 10 ? '0' + ep : ep);
    const scene = state.data.scenes[state.currentSceneIdx];
    const here = (scene && scene.progLabel) ? scene.progLabel : '';
    return `
      <div class="top-nav">
        <div class="nav-kebab" tabindex="0" role="button" aria-haspopup="true"
             aria-label="메뉴 열기${here ? ' · 현재 ' + escapeHTML(here) : ''}">
          <div class="nav-kebab-head">
            <span class="kebab-dots" aria-hidden="true"><i></i><i></i><i></i></span>
            ${here ? `<span class="nav-here">${escapeHTML(here)}</span>` : ''}
          </div>
          <div class="nav-menu" role="menu">
            <span class="nav-menu-ep">${escapeHTML(epLabel)}</span>
            <a href="../../index.html" target="_top" role="menuitem">← 홈으로</a>
            <a href="../../joseon-kings.html" target="_top" role="menuitem">시리즈 목록 →</a>
          </div>
        </div>
      </div>
    `;
  }

  function progressBar() {
    const canGoBack = canGoBackFromHere();
    // 현재 위치 라벨은 점3개 메뉴(headerNav) 옆으로 옮겼다.
    return `
      <div class="prog">
        ${canGoBack ? '<button class="prog-back" id="prog-back" title="이전 화면으로">↶</button>' : '<span class="prog-back-spacer"></span>'}
        <div class="prog-bar">
          <div class="prog-fill" style="width:0%;"></div>
        </div>
      </div>
    `;
  }

  // 지금 위치에서 뒤로갈 수 있는가
  function canGoBackFromHere() {
    return state.currentSceneIdx > 0;
  }

  function goBack() {
    if (!canGoBackFromHere()) return;
    state.currentSceneIdx--;
    renderScene();
  }

  // 다음 씬의 타입에 따라 버튼 라벨 결정
  // 학생이 무엇을 보러 가는지 알 수 있게 해야 함
  function getNextLabel() {
    const next = state.data.scenes[state.currentSceneIdx + 1];
    if (!next) return '완료 →';
    switch (next.type) {
      case 'narration':
        // 다음이 나레이션이면 — 새 막의 시작
        return '다음 막 →';
      case 'context':
        return '시대 상황 보기 →';
      case 'game':
        return '게임 시작 →';
      case 'deep':
        return '깊게 살펴보기 →';
      case 'epilogue':
        return '에필로그 →';
      default:
        return '다음 →';
    }
  }

  // ─── 인라인 마크업 파서 ──────────────────────────────────
  // [b]진하게[/b], [i]기울임[/i], [em]강조[/em],
  // 또는 *진하게* (마크다운 호환)
  function parseInline(text, noGloss) {
    if (!text) return '';
    const html = escapeHTML(text)
      // 줄바꿈을 품은 태그도 처리 — (.+?)는 개행을 못 먹어서
      // 태그가 화면에 그대로 노출되던 문제가 있었다.
      .replace(/\[b\]([\s\S]+?)\[\/b\]/g,   '<strong>$1</strong>')
      .replace(/\[i\]([\s\S]+?)\[\/i\]/g,   '<em>$1</em>')
      .replace(/\[em\]([\s\S]+?)\[\/em\]/g, '<em>$1</em>')
      .replace(/\*\*(.+?)\*\*/g,        '<strong>$1</strong>')
      .replace(/\*([^*\n]+?)\*/g,       '<em>$1</em>')
      .replace(/__(.+?)__/g,            '<em>$1</em>')
      .replace(/\n/g, '<br>');
    return noGloss ? html : linkTerms(html);
  }

  // ─── 낱말 풀이 링크 ──────────────────────────────────────
  // 사전: shared/glossary.js(window.GLOSSARY) + 편의 scenes.json "glossary"
  // 어려운 낱말을 점선 밑줄로 바꾸고, 누르면 풀이 말풍선을 띄운다.
  let glossDict = {};
  let glossRe = null;
  let glossSeen = new Set();
  let glossPop = null;

  function setupGlossary(extra) {
    glossDict = Object.assign({}, window.GLOSSARY || {}, extra || {});
    const terms = Object.keys(glossDict).filter(t => t && glossDict[t])
      .sort((a, b) => b.length - a.length)
      .map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
    glossRe = terms.length ? new RegExp('(^|[^가-힣])(' + terms.join('|') + ')', 'g') : null;
    if (!glossPop) bindGlossPop();
  }

  // 태그 밖의 글자에서만 찾는다. 앞이 한글이면(왕세자) 건너뛰고,
  // 뒤가 하·해·했·할·한(대비하다)이면 건너뛴다.
  // 바로 뒤에 괄호 풀이가 붙어 있으면 그 자리에서 풀린 것으로 친다.
  function linkTerms(html) {
    if (!glossRe) return html;
    return html.split(/(<[^>]+>)/).map(part => {
      if (!part || part[0] === '<') return part;
      return part.replace(glossRe, (m, pre, term, offset, str) => {
        const after = str.slice(offset + m.length);
        if (/^[하해했할한]/.test(after)) return m;
        if (glossSeen.has(term)) return m;
        glossSeen.add(term);
        if (/^\s*\(/.test(after)) return m;
        return pre + `<span class="term" tabindex="0" role="button" data-term="${term}">${term}</span>`;
      });
    }).join('');
  }

  function glossWho(who) {
    return linkTerms(escapeHTML(who));
  }

  function bindGlossPop() {
    glossPop = document.createElement('div');
    glossPop.className = 'gloss-pop';
    glossPop.setAttribute('role', 'tooltip');
    document.body.appendChild(glossPop);

    document.addEventListener('click', e => {
      const t = e.target.closest && e.target.closest('.term');
      if (t) { e.stopPropagation(); showGloss(t); }
      else if (!glossPop.contains(e.target)) hideGloss();
    }, true);
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') { hideGloss(); return; }
      const t = document.activeElement;
      if ((e.key === 'Enter' || e.key === ' ') && t && t.classList && t.classList.contains('term')) {
        e.preventDefault();
        showGloss(t);
      }
    });
    window.addEventListener('scroll', hideGloss, { passive: true });
    window.addEventListener('resize', hideGloss);
  }

  function showGloss(t) {
    const term = t.dataset.term;
    const def = glossDict[term];
    if (!def) return;
    if (glossPop.classList.contains('on') && glossPop.dataset.term === term) { hideGloss(); return; }
    glossPop.innerHTML = `<b>${escapeHTML(term)}</b>${escapeHTML(def)}`;
    glossPop.dataset.term = term;
    glossPop.classList.add('on');
    const r = t.getBoundingClientRect();
    const pw = glossPop.offsetWidth, ph = glossPop.offsetHeight;
    const vw = document.documentElement.clientWidth, vh = window.innerHeight;
    const left = Math.min(Math.max(12, r.left + r.width / 2 - pw / 2), vw - pw - 12);
    let top = r.bottom + 8;
    if (top + ph > vh - 8) top = Math.max(8, r.top - ph - 8);
    glossPop.style.left = left + 'px';
    glossPop.style.top = top + 'px';
  }

  function hideGloss() {
    if (glossPop) { glossPop.classList.remove('on'); glossPop.dataset.term = ''; }
  }

  function escapeHTML(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ─── 외부 노출 ──────────────────────────────────────────
  window.GameEngine = {
    start: start,
    restart: restart,
    getState: () => ({ ...state }) // 디버그용
  };

})();

</script>

(function(){
  var data = {"ep":0,"slug":"jeongdojeon","korName":"정도전","personalName":"삼봉(三峰)","title":"정도전 — 도면의 사람","tagline":"600년의 도면을 그린 자","theme":"cold-iron","scenes":[{"type":"opening","question":"사람은 언제 죽는가?","glyph":"圖","series":"역사체험 교육 게임 · 조선의 왕 시리즈 번외편 · 정도전","lines":["[em]몸[/em]이 죽을 때.","[em]의지[/em]가 죽을 때.","사람들에게 [em]잊혀질[/em] 때."],"progLabel":"프롤로그"},{"type":"narration","era":"프롤로그 · 1350년경 · 영주","text":"1350년경. 영주.\n\n해가 진다.\n어린 정도전 — 마당 가운데에 서 있다.\n\n아이들이 둥글게 둘러쌌다.\n그들이 — [em]이름을 부른다.[/em]\n\n그 이름은 — [b]그의 이름이 아니다.[/b]","progLabel":"0막 · 어린 시절"},{"type":"context","year":"0막","title":"이름이 없는 아이 — 1342년 출생","body":"정도전은 [b]1342년[/b] 영주에서 태어났다. 집안은 [em]봉화 정씨[/em]. 어른이 되어 받은 이름(자)은 종지(宗之), 스스로 지어 부른 이름(호)은 [em]삼봉(三峰)[/em].\n\n아버지 [b]정운경[/b]은 형부상서(법과 형벌을 맡은 관청의 으뜸 벼슬)까지 오른 관리였다. 그러나 — 어머니 쪽이 문제였다. 어머니는 단양 우씨, 우연(禹延)의 딸. 그런데 이런 말이 돌았다. 외할아버지 우연의 장인 김전이 스님으로 있을 때, [em]종(남의 집에 매여 일하던 사람) 수이의 아내[/em]에게서 몰래 낳은 딸 — 그 딸이 정도전의 외할머니라는 것.\n\n그 소문이 정도전의 평생을 따라다녔다. 권력자들이 그를 공격할 때 늘 꺼내는 카드 — [b]\"종의 자식\"[/b]. 정몽주·이숭인 같은 뛰어난 친구들 사이에서도, 과거(나라에서 관리를 뽑는 시험)에 붙은 뒤에도, 재상(나랏일을 이끄는 가장 높은 신하)이 된 뒤에도 — [em]이 한 마디는 사라지지 않았다.[/em]\n\n이름은 — 누가 정하는가. 자기가 정하는가, 세상이 정하는가. 어린 정도전은 — 그 답을 [b]마당에서 처음 배웠다.[/b]","progLabel":"0막 · 어린 시절"},{"type":"game","dialogues":[{"type":"narration","text":"영주의 마당. 해가 기울고 있었다. 어린 정도전이 책을 들고 서 있었다.\n\n동네 아이들이 다가왔다. 다섯 명. 일곱 명. 모여들었다. 그들은 — 정도전을 둥글게 둘러쌌다."},{"type":"dial","role":"npc-c","who":"아이 1","text":"종의 자식."},{"type":"dial","role":"npc-c","who":"아이 2","text":"외할미가 종이라며. 그 피가 어디 가."},{"type":"dial","role":"npc-c","who":"아이 3","text":"이름도 천하다. 도전(道傳)? 도(道)는 — 양반들 글자다."},{"type":"inner","text":"이름은 — 내 것이 아닌가.\n아버지가 지어준 이름. [em]도(道)를 전한다.[/em] 그러나 — 사람들이 부르는 이름은 그것이 아니다. 그들이 부르는 이름은 — [b]종의 자식.[/b]"},{"type":"narration","text":"정도전은 — [b]책을 더 꽉 잡았다.[/b] 책 모서리가 손가락에 박혔다. 그러나 — 놓지 않았다.\n\n그날 밤 — 그는 책을 다 외웠다. [em]자기 이름을 새로 만들기 위해서.[/em]"}],"choice":{"type":"reflection","label":"당신이 \"종의 자식\"이라 불릴 때 — 무엇을 하겠는가?","flag":"act0_name","options":[{"text":"침묵하고 — 책을 더 잡는다","feedback":"정도전의 길이다. 그는 [em]말로 갚지 않았다.[/em] 글로 갚았다. 평생. 훗날 그가 새 나라의 법을 적어 쓴 [b]조선경국전[/b]도 — 그 마당에서 시작된 글이다. [em]\"내가 누군지를 — 내 글로 보여준다.\"[/em]"},{"text":"맞서 싸운다 — 그 자리에서","feedback":"정직한 길이다. 다만 — 오늘 싸워 이겨도, 아이들은 내일 또 온다. 정도전은 알았다. 마당의 싸움은 — [em]평생 끝나지 않는다.[/em] 그래서 그는 [b]마당을 떠나는 길[/b]을 골랐다. 책 안으로."},{"text":"그 자리를 떠난다 — 다른 곳으로","feedback":"현실적인 길이다. 그러나 정도전은 — [b]떠날 곳이 없었다.[/b] 다른 마당에 가도 같은 말을 들었다. 그래서 그는 떠나는 대신 — [em]자기 안으로[/em] 들어갔다. 책으로."}]},"progLabel":"0막 · 어린 시절"},{"type":"deep","tag":"0막 · 깊게 살펴보기","title":"이름이 죽은 자","text":"사람의 [b]첫 번째 죽음[/b]은 — 몸이 죽을 때가 아니다. [em]이름이 죽을 때[/em]다. 정도전은 어린 시절 — 한 번 죽었다. 마당의 둥근 원 안에서. 아무도 자기를 제 이름으로 불러 주지 않는다는 것을 안 그날.\n\n어떤 사람은 이 첫 죽음에 — [b]주저앉는다.[/b] 어떤 사람은 — [b]도망친다.[/b] 어떤 사람은 — [em]새 이름을 만든다.[/em]\n\n정도전은 새 이름을 만들기로 했다. 그러나 — 새 이름은 말로 만들어지지 않는다. [b]일로 만들어진다.[/b] 그래서 그는 평생 [em]일[/em]만 했다. 책을 외웠다. 과거를 보았다. 잘못된 것을 비판했다. 유배(벌로 먼 시골에 보내져 갇혀 사는 것)를 갔다. 새 나라의 밑그림, 곧 [em]도면[/em]을 그렸다. 나라를 세웠다.\n\n그가 세운 나라의 이름이 — [b]조선(朝鮮)[/b]이다. [em]\"종의 자식\"이라 불리던 아이가 만든 나라.[/em] 그것이 그가 자기에게 준 [b]진짜 이름[/b]이었다.","quote":"이름이 죽은 자만이 — 새 이름을 만들 수 있다.","actId":"act0","progLabel":"0막 · 깊게 살펴보기"},{"type":"narration","era":"1막 · 1375년 → 1383년","text":"1375년. 서른셋.\n\n이인임(그때 고려 조정을 쥐고 흔들던 권력자)을 비판했다.\n[em]원나라 편에 선 자들을 베라.[/em]\n\n돌아온 것은 — 유배.\n나주 회진. 거평부곡.\n\n9년이 흐른다.\n나라 끝 먼 고을을 떠돈다.\n\n1383년 — 함흥.\n[b]그가 처음 보는 군대가 있었다.[/b]","progLabel":"1막 · 1375-1383"},{"type":"context","year":"1375-1383","title":"유배 9년 — 그리고 함흥","body":"1375년, [b]이인임[/b]과 그 무리가 원나라 편에 서려 하자 — 정도전은 이를 비판했다. 원나라(북원)에서 온 사신(나라의 심부름으로 온 관리)을 맞이하라는 명을 거부했다. 그 결과 — [em]나주 회진 거평부곡[/em] 유배. 3년.\n\n거평부곡은 산골이었다. 정도전은 그곳에서 — 농민들과 살았다. 그곳에서 쓴 글 「[em]소재동기(消災洞記)[/em]」에 그는 이렇게 적었다. *\"이 사람들은 글자를 모르나 — 마음에는 도(道)가 있다.\"* 양반의 글이 아니라 [b]사람[/b]을 본 시기였다.\n\n3년 뒤 유배는 풀렸지만 — 고려의 서울 개경에는 들어오지 못했다. 유배를 떠난 해부터 9년 동안, 그는 나라 끝 먼 고을을 떠돌았다. 그리고 [b]1383년[/b], 마흔하나. 정도전은 — 함흥으로 갔다. 이성계의 [em]동북면(지금의 함경도 쪽) 군영[/em](군대가 머무는 진지)으로.\n\n그가 본 것은 — 칼이었다. 머릿속에만 있던 새 나라의 도면을 — [b]진짜로 세울 수 있는 칼[/b]이었다.","progLabel":"1막 · 1383년"},{"type":"game","dialogues":[{"type":"narration","text":"1383년 가을. 함흥. 군영 안. 군사들이 늘어서 있었다. 칼끝이 한 줄로 가지런했다. 활시위가 일제히 당겨졌다 풀렸다. 톱니바퀴처럼 — 움직였다.\n\n정도전은 — 오래 보았다."},{"type":"dial","role":"npc-b","who":"이성계","text":"여기까지 왔는가."},{"type":"dial","role":"npc-a","who":"이지란","text":"이 사람이 그 정도전이오? 개경에서 — 글로 유명하다는."},{"type":"narration","text":"정도전은 — 이성계의 얼굴이 아니라 [em]군영[/em]을 다시 보았다. 군사들의 발. 칼의 각도. 깃발의 방향."},{"type":"dial","role":"king","who":"정도전","text":"장군. 이 군대로 — [b]무엇을 못 하겠습니까.[/b]"},{"type":"narration","text":"이성계의 표정이 — 잠깐 굳었다. 이지란도 — 정도전을 보았다. 이성계는 — 이 말이 무엇을 뜻하는지 알았다.\n\n*\"이 군대로 무엇을 못 하겠습니까(以此軍何事不可).\"* 이것은 — 칭찬이 아니었다. 이것은 — [b]제안[/b]이었다. 이 군대라면 고려를 넘어 — 새 나라도 세울 수 있다는."},{"type":"inner","text":"다시 태어났다.\n어린 시절 마당에서 한 번 죽은 자가 — 가지런한 칼끝 앞에서 [em]두 번째 이름[/em]을 받았다. 그 이름은 — [b]설계자[/b](나라의 밑그림을 그리는 사람)."}],"choice":{"label":"당신이 이 군영을 보았다면 — 무엇을 하겠는가?","flag":"act1_oath","options":[{"text":"이 칼을 빌려 — 옛 나라를 고친다","feedback":"그 길도 있었다. 많은 사람이 그 길로 갔다.\n다만 정도전은 9년 유배 동안 다른 결론에 닿아 있었다 — [em]고려는 고쳐지지 않는다.[/em]\n\n그는 [b]고치러 온 것이 아니라, 바꾸러 왔다.[/b]"},{"text":"이 칼로 — 새 나라를 세우고 그 도면을 내가 그린다","feedback":"정도전이 한 것이 이것이었다.\n[i]\"이 군대로 무엇을 못 하겠습니까.\"[/i]\n\n칭찬이 아니었다. [b]제안이었다.[/b]"},{"text":"이 칼은 언젠가 나를 향한다 — 거리를 둔다","feedback":"옳은 예감이다. 15년 뒤, 그 칼은 정말로 그를 향했다.\n정도전은 그것을 몰랐던 것이 아니다. [em]알면서 들어왔다.[/em]\n\n그것이 설계자의 자리였다 — [b]자기 도면 안에 자기도 들어가는 자리.[/b]"}],"type":"reflection"},"progLabel":"1막 · 1383년"},{"type":"deep","tag":"1막 · 깊게 살펴보기","title":"다시 태어났다","text":"*\"이 군대로 무엇을 못 하겠습니까.\"* 이 한 마디가 — 정도전의 [b]두 번째 출생[/b]이었다. 어머니가 낳은 정도전은 — 영주의 아이였다. 종의 자식이라 불린 아이였다. 그러나 — 함흥의 군영이 낳은 정도전은 [em]도면을 그릴 수 있는 사람[/em]이었다.\n\n그가 본 것은 단순한 군대가 아니었다. 그가 본 것은 — [b]질서[/b]였다. 톱니바퀴처럼 움직이는 사람들. 한 사람의 의지로 — 천 명이 같은 방향을 보는 것. 그것이 [em]나라[/em]의 본바탕이라는 것을 그는 알았다.\n\n이성계는 — 자기가 [b]나라를 세울 수 있다[/b]는 말을 그때 처음 들었다. 정도전이 그것을 [em]말로 만들어 주었다.[/em] 그날 이전까지 이성계는 싸움을 잘하는 장수였다. 그날 이후 — 그는 [b]나라를 세울 수 있는 사람[/b]이었다.\n\n둘은 서로를 새로 태어나게 했다. 정도전은 장수 이성계를 나라를 세울 사람으로, 이성계는 떠돌던 정도전을 설계자로. [em]그것이 1383년 함흥의 진짜 사건이다.[/em]","quote":"다시 태어난 자는 — 두 번 죽을 수 있는 자이다.","actId":"act1","progLabel":"1막 · 깊게 살펴보기"},{"type":"narration","era":"2막 · 1389-1392","text":"1389년 12월.\n[em]강릉의 우왕[/em] — 죽다.\n[em]강화의 창왕[/em] — 죽다.\n(둘 다 왕 자리에서 쫓겨난 고려의 왕)\n\n도면이 — [b]피로 그어진다.[/b]\n\n1392년 4월.\n선죽교.\n[em]정몽주[/em] — 죽다.\n\n정도전은 — 도면 앞에 앉아 있다.\n붓을 든다.\n[b]손이 떨린다.[/b]","progLabel":"2막 · 1389-1392"},{"type":"context","year":"1389-1392","title":"친구를 잃은 자리","body":"정몽주는 정도전의 [b]평생 친구[/b]였다. 같이 [em]이색[/em] 선생 밑에서 배웠다. 같이 신진사대부(고려 말에 새로 떠오른 젊은 선비 관리들)였다. 둘 다 — 고려를 사랑했고, 고려를 고치고 싶어 했다.\n\n그러나 — 결정적인 순간에 [b]길이 갈렸다.[/b] 정몽주는 [em]고려 안에서의 개혁[/em]을 끝까지 믿었다. 정도전은 — [em]고려 자체를 바꿔야 한다[/em]고 결론냈다.\n\n[b]1388년[/b] 위화도 회군(요동을 치러 가던 이성계가 군대를 되돌려 개경으로 돌아온 일) 뒤 우왕이 왕 자리에서 쫓겨났고, [b]1389년[/b]에는 그 아들 창왕마저 쫓겨났다. \"우왕·창왕은 왕씨가 아니라 [em]신돈(공민왕 때 권력을 쥐었던 승려)의 자식[/em]이다(신우신창설)\" — 정도전이 주도한 논리였다. 정몽주도 동의했다. 그해 12월, 강릉의 우왕과 강화의 창왕이 — [b]죽임을 당했다.[/b] 정도전의 도면 위에서.\n\n[b]1392년 4월 4일.[/b] 정몽주가 이성계 쪽 사람들을 마지막으로 막으려 했다. 그날 — [em]선죽교[/em](개경의 돌다리)에서 이방원(이성계의 다섯째 아들)의 손에 죽었다. 정도전은 — 그 시신을 보러 가지 않았다.\n\n3개월 뒤 — [b]7월 17일, 조선이 열렸다.[/b]","progLabel":"2막 · 1392년"},{"type":"game","dialogues":[{"type":"narration","text":"1392년 4월 5일. 새벽. 정도전의 집. 사람이 와서 — 한 마디를 했다.\n\n*\"정몽주가 — 죽었습니다.\"*\n\n정도전은 도면을 보고 있었다. 새 나라의 도면. 종이 위에 — 글자가 있었다. *조선(朝鮮).* 아직 정해지지 않은 이름. 그가 잠시 적어본 이름."},{"type":"inner","text":"친구가 죽었다.\n그러나 — 죽인 자는 [b]내가 아니다.[/b]\n아니 — 친구를 죽인 것은 [em]내가 그린 도면이다.[/em]"},{"type":"narration","text":"도면 위에서 — 손이 떨렸다. 그러나 — 그 떨림은 [b]아무도 보지 못했다.[/b] 정도전은 그것을 — 안 보이게 했다.\n\n그날 오후, 이방원이 정도전을 찾아왔다."},{"type":"dial","role":"npc-c","who":"이방원","text":"정몽주는 — 끝까지 우리를 막으려 했소. 어쩔 수 없었소."},{"type":"dial","role":"king","who":"정도전","text":"이방원. 그 칼은 — [b]평생 너의 손에 남는다.[/b]"},{"type":"narration","text":"이방원은 — 정도전을 오래 보았다. 둘은 같은 [em]도면[/em] 위에 있었다. 그러나 — [b]각자 다른 자리에서.[/b]\n\n그날 밤 정도전은 — 정몽주가 자기에게 보낸 [em]옛 시[/em] 한 편을 펼쳤다. 읽지 않았다. 한참 그대로 두었다. 그리고 — [b]접었다.[/b]"}],"choice":{"type":"reflection","label":"정몽주의 죽음 — 정도전에게 그것은 무엇이었는가?","flag":"act2_loss","options":[{"text":"친구의 죽음 — 평생 짊어진 슬픔","feedback":"그것은 사실이었다. 정도전은 [em]정몽주의 이름을 다시 입에 올리지 않았다.[/em] 그것은 잊었기 때문이 아니라 — [b]잊을 수 없었기 때문에[/b]였다."},{"text":"도면의 대가 — 큰 그림을 위해 피할 수 없던 일","feedback":"정도전 자신의 답이었을 것이다. *\"도면을 그리는 자는 — 도면의 대가를 자기 안에서 치른다.\"* 그러나 — [b]대가를 치렀다는 말이 슬픔이 없었다는 뜻은 아니다.[/b]"},{"text":"자기 자신의 죽음 — 바르게 살려던 마음이 함께 죽었다","feedback":"이것이 [b]두 번째 죽음[/b]이었다. 어린 시절 [em]이름이 죽었고[/em], 이번에는 — [em]책을 잡고 시를 쓰던 사람[/em]이 그의 안에서 죽었다. 그 후 정도전은 — 도면만 보고 살았다."},{"text":"답할 수 없다 — 한 사람의 슬픔을 한 단어로 평가할 수 없다","feedback":"[b]가장 정직한 답이다.[/b] 정도전은 — 평생 그 답을 정하지 않았다. 정하지 못한 채로 — 도면을 그렸다. 그것이 [em]도면 위의 진짜 무게[/em]였다."}]},"progLabel":"2막 · 1392년"},{"type":"deep","tag":"2막 · 깊게 살펴보기","title":"손이 떨렸다","text":"정도전과 이성계 쪽 사람들은 [em]신우신창설[/em]을 내세워 우왕과 창왕을 왕 자리에서 끌어내렸다. 1389년 12월, 둘은 [b]죽임을 당했다.[/b] 우왕은 강릉에서, 창왕은 강화에서. 정도전이 주도한 논리 위에서 — 두 왕이 죽었다. 한 명은 스물넷, 한 명은 [em]아홉 살[/em]이었다.\n\n3년 뒤, 친구가 죽었다. 같이 글을 읽었던 친구. 같이 고려를 사랑했던 친구. 끝까지 [em]다른 도면[/em]을 그리려 했던 친구.\n\n정도전은 — 이 모든 것을 [b]자기 도면의 무게[/b]로 끌어안았다. 변명하지 않았다. 다른 사람에게 떠넘기지 않았다. 그러나 — 그날 이후 그의 시(詩)는 — [em]거의 사라진다.[/em] 그는 시인이었던 사람이다. 학자였던 사람이다. 그가 — 시를 거의 쓰지 않게 된 그 순간.\n\n그 순간이 — 정도전의 [b]두 번째 죽음[/b]이었다. 책을 잡고 시를 쓰던 한 사람이 — 그 안에서 죽었다. 그리고 — [em]설계자[/em]만 남았다.","quote":"도면을 그리는 자는 — 도면의 대가를 자기 안에서 치른다.","actId":"act2","progLabel":"2막 · 깊게 살펴보기"},{"type":"narration","era":"3막 · 1394-1397","text":"1394년. 「[em]조선경국전[/em]」.\n나라의 [b]법[/b]을 그린다.\n\n1394년 8월. 한양 천도(나라의 서울을 옮김).\n나라의 [b]자리[/b]를 그린다.\n\n1395년. 경복궁.\n나라의 [b]집[/b]을 그린다.\n\n전각마다 이름을 단다.\n근정. 사정. 강녕. 교태.\n사대문(서울의 동서남북 큰 문)에 인의예지(어짊·옳음·예의·슬기)를 새긴다.\n\n한 글자 한 글자가 — [b]600년을 가는 못[/b]이다.","progLabel":"3막 · 1394-1397"},{"type":"context","year":"1394-1397","title":"도면의 시간","body":"조선이 열린 후 6년. 정도전은 — [b]4가지 도면[/b]을 그렸다.\n\n[em]법의 도면[/em]: [b]「조선경국전」(1394)[/b]. 나라의 명령 없이 정도전이 혼자 써낸 조선의 기본 법(헌법). 훗날 조선의 법전 「경국대전」의 바탕이 되었다.\n\n[em]자리의 도면[/em]: [b]한양 천도(1394.8)[/b]. 정도전이 자리를 골랐다. 북악산 아래. 좌청룡 우백호(왼쪽과 오른쪽을 산이 감싸 안은 자리). 종묘(왕의 조상을 모신 사당)는 동쪽에, 사직(땅과 곡식의 신에게 제사 지내는 곳)은 서쪽에. 도성(서울을 둘러싼 성)의 큰 문 넷과 작은 문 넷의 위치까지.\n\n[em]집의 도면[/em]: [b]경복궁(1395.9 완공)[/b]. 정도전이 자리, 방향, 모든 전각(궁궐 안의 큰 건물)의 배치, 그리고 — [em]이름[/em]까지 지었다. 근정전(勤政) 사정전(思政) 강녕전(康寧) 교태전(交泰). 사대문에 [b]인의예지[/b]를 새겼다. 흥인지문(東) 돈의문(西) 숭례문(南) 숙정문(北).\n\n[em]정치의 도면[/em]: [b]「경제문감」(1395)[/b]. [em]재상 중심 정치[/em]를 이론으로 정리했다. 임금은 나라를 대표하는 상징이 되고, 실제 나랏일은 재상이 맡는다. 임금 한 사람의 능력에 나라가 흔들리지 않게.\n\n[b]이 4개의 도면이 — 600년을 갔다.[/b]","progLabel":"3막 · 1394-1397"},{"type":"game","dialogues":[{"type":"narration","text":"1395년 가을. 정도전은 「경복궁기(景福宮記)」를 쓰고 있다. 붓을 들고. 종이 앞에. 옆에 — 이성계가 와서 본다."},{"type":"dial","role":"npc-b","who":"이성계","text":"이 자리에 — 무엇이 들어서는가."},{"type":"dial","role":"king","who":"정도전","text":"이 자리에 — 근정전(勤政). 정치에 부지런하라. 이 자리에 — 사정전(思政). 정치를 생각하라. 이 자리에 — 강녕전(康寧). 임금이 편안하라. 이 자리에 — 교태전(交泰). 하늘과 땅의 기운(음양)이 잘 어우러지라."},{"type":"inner","text":"한 글자, 한 글자가 — [b]600년을 가는 못[/b]이다.\n사람은 죽어도 — 글자는 남는다."},{"type":"dial","role":"npc-b","who":"이성계","text":"자네는 — 이 도면의 한가운데에 [em]임금[/em]을 두는가, [em]신하[/em]를 두는가."},{"type":"narration","text":"정도전은 — 잠깐 붓을 멈췄다. 이성계의 눈을 봤다. 오래 봤다."},{"type":"dial","role":"king","who":"정도전","text":"이 도면 안에는 — [b]나라[/b]가 있습니다. 임금도, 신하도, 백성도 — 그 안에 있습니다.\n\n임금은 [em]상징[/em]이 되십시오. 재상이 — [b]일[/b]을 하겠습니다. 한 사람의 능력에 나라가 흔들리지 않게."},{"type":"narration","text":"이성계는 — 오래 침묵했다. 그리고 — 고개를 끄덕였다.\n\n그러나 — 그날 옆방에 있던 [b]다섯째 아들 이방원[/b]이 — 이 말을 들었다."}],"choice":{"label":"당신이 나라의 도면을 그린다면 — 임금을 어디에 두겠는가?","flag":"act3_design","options":[{"text":"임금이 모든 것을 직접 결정한다","feedback":"강한 임금은 빠르다.\n다만 — [em]능력이 있는 동안만 강하다.[/em] 다음 임금이 약하면 나라가 흔들린다.\n\n정도전은 그 위험을 보았다. 그래서 [b]그리지 않은 도면[/b]이다."},{"text":"임금은 상징으로 두고 — 재상이 일을 한다","feedback":"정도전이 그린 도면이 이것이었다.\n한 사람의 능력에 나라가 흔들리지 않게. 「경제문감」이 그 이론이다.\n\n다만 — [em]그 말을 옆방의 다섯째가 듣고 있었다.[/em]"},{"text":"신하들이 서로 견제하게 둔다","feedback":"견제는 안전해 보인다.\n다만 책임이 흩어지면 — [em]아무도 책임지지 않는다.[/em]\n\n정도전이 그린 것은 책임을 나누는 도면이 아니라, [b]책임을 한 사람(재상)에게 명확히 두는[/b] 도면이었다."}],"type":"reflection"},"progLabel":"3막 · 1394-1397"},{"type":"deep","tag":"3막 · 깊게 살펴보기","title":"옆방의 다섯째","text":"정도전이 그린 네 개의 도면은 모두 한 가지를 향했다. [b]한 사람에게 나라를 걸지 않는 것.[/b]\n\n법을 적어 두면 — 임금이 바뀌어도 법이 남는다. 자리를 정해 두면 — 사람이 바뀌어도 자리가 남는다. 이름을 새겨 두면 — 세대가 바뀌어도 이름이 남는다. 재상에게 일을 맡기면 — 임금이 약해도 나라가 돈다.\n\n[em]사람을 믿지 않는 설계였다.[/em] 그가 평생 사람에게 당해 왔기 때문이다. 마당의 아이들. 이인임. 9년의 유배. 사람은 그를 \"종의 자식\"이라 불렀지만 — [b]글자는 그를 그렇게 부르지 않았다.[/b]\n\n그래서 그는 사람 대신 글자와 자리에 나라를 맡겼다.\n\n그런데 이 설계에는 [b]빈칸이 하나 있었다.[/b] 임금을 상징으로 두는 도면은 — [em]상징이 되기를 거부하는 임금[/em] 앞에서 무엇을 할 수 있는가.\n\n그날 옆방에서 그 말을 들은 다섯째는 — 상징이 될 사람이 아니었다.","quote":"사람을 믿지 않는 설계는 — 사람에게 무너진다.\n\n[em]정도전은 모든 자리를 그렸다.[/em]\n단 하나 — [b]도면을 거부하는 사람의 자리만 그리지 않았다.[/b]","actId":"act3","progLabel":"3막 · 깊게 살펴보기"},{"type":"narration","era":"4막 · 1398.8.26","text":"1398년 8월 26일. 밤.\n\n남은(정도전과 뜻을 함께한 신하)의 집.\n등불. 술잔.\n\n술자리에 종이는 없다.\n그래도 도면은 — [em]늘 머릿속에 있다.[/em]\n\n밖에서 — [b]횃불.[/b]\n말발굽.\n\n정도전 — [em]일어선다.[/em]\n그리고 — 몸을 숨긴다.","progLabel":"4막 · 1398.8.26"},{"type":"context","year":"1398","title":"마지막 밤","body":"1398년 8월. 이성계의 병이 깊었다. 정도전은 — [b]사병 혁파[/b]를 밀어붙이고 있었다. 왕자들이 저마다 거느린 개인 군대(사병)를 없애는 일. 이방원에게 — [em]목숨이 걸린 일[/em]이었다.\n\n8월 26일 밤. 정도전은 [b]남은(南誾)의 집[/b]에서 술을 마시고 있었다. 가벼운 자리였다. 도면 이야기. 다음 도면 이야기.\n\n그때 — 이방원이 군사를 일으켰다. 명분(남들 앞에 내세우는 그럴듯한 이유): *\"정도전이 왕자들을 [em]제거하려 한다[/em].\"* 진실인지 아닌지 — 600년이 지나도 답이 안 나는 문제. 그러나 — 그날 밤 그것은 [b]명분이 되었다.[/b]\n\n남은의 집이 포위됐다. 이웃집에 불이 붙었다. 모두 흩어져 숨었다. 정도전은 이웃집으로 몸을 피했지만 — 곧 들켜 [b]끌려 나왔다.[/b]\n\n그 자리에서 — 죽임을 당했다. 쉰여섯. 그날 밤 이성계의 어린 아들 방번도, 세자(왕의 뒤를 이을 아들) 방석도, 남은도 — 함께 죽었다.\n\n그 뒤 [b]467년 동안[/b] 그는 [em]역적[/em](나라를 배신한 죄인)이었다. 그러나 — 그가 그린 도면은 그 467년 동안에도 [b]작동했다.[/b]","progLabel":"4막 · 1398년"},{"type":"game","dialogues":[{"type":"narration","text":"1398년 8월 26일. 밤. 남은의 집. 등불 아래 둘러앉아 웃으며 이야기하던 자리. 그때 — 지붕 기와 위로 화살 세 대가 떨어졌다. 이웃집 세 곳에서 불길이 올랐다."},{"type":"inner","text":"왔구나.\n[em]도면을 그리는 자는 — 언젠가 자기 도면 위에서 베이게 된다.[/em] 그것을 — 1383년 함흥의 군영 앞에서 이미 알았다."},{"type":"narration","text":"모두 흩어져 숨었다. 정도전은 — 이웃 민부의 집으로 몸을 피했다. 방 안 깊숙이 숨었다."},{"type":"dial","role":"npc-a","who":"민부","text":"배가 불룩한 사람이 우리 집에 들어왔소."},{"type":"narration","text":"군사들이 소리쳐 그를 불러냈다. 정도전은 짧은 칼을 쥔 채 — 걷지 못하고 기어서 나왔다. 칼을 버리라는 말에 칼을 던졌다."},{"type":"dial","role":"king","who":"정도전","text":"죽이지 마시오. 한마디만 하고 죽게 해 주시오."},{"type":"narration","text":"군사들이 그를 끌고 갔다. 횃불 아래. 이방원이 — 말 위에 있었다."},{"type":"dial","role":"king","who":"정도전","text":"1392년에 공이 나를 살려 주었듯이 — 오늘도 살려 주시오."},{"type":"dial","role":"npc-c","who":"이방원","text":"너는 조선의 봉화백(나라에서 내린 높은 작위)이 되었다. 그것으로도 모자랐느냐. 어찌 이렇게까지 악한 짓을 했느냐."},{"type":"narration","text":"이방원은 — 베라고 명했다.\n\n실록이 적은 그 밤의 정도전은 담담한 영웅이 아니었다. [em]살려 달라고 말한 사람[/em]이었다."}],"choice":{"type":"reflection","label":"[b]당신은[/b] 정도전이 언제 죽었다고 생각하는가?","flag":"act4_when","options":[{"text":"1398년 8월 26일 — 몸이 죽은 그 밤","feedback":"가장 흔한 답이다. 그리고 가장 명료한 답이다. 그러나 정도전에게 그 밤은 — 처음도 마지막도 아니었다. 그는 그 전에 이미 두 번 죽었고(이름이 죽은 날, 친구를 잃은 날), 그 뒤에도 도면 속에 살아 있었다. 그 밤은 [b]그 사이의 한 지점일 뿐이다.[/b]"},{"text":"어린 시절 — \"종의 자식\"이라 불리며 이름이 죽었을 때","feedback":"가장 인간적인 답이다. 한 사람의 [b]첫 죽음[/b]은 이름이 죽을 때다. 정도전은 그때 한 번 죽었다. 그래서 그는 — 새 이름을 만들기 위해 [em]평생[/em]을 썼다. 그 평생 자체가 — [b]첫 죽음에 대한 답[/b]이었다."},{"text":"1392년 — 정몽주를 잃고, 손에 피가 묻은 그날","feedback":"가장 도덕적인 답이다. 그날 — 책을 잡고 시를 쓰던 사람이 그의 안에서 죽었다. 그리고 [em]설계자[/em]만 남았다. [b]바르게 살려던 마음은 그의 안에서 죽었어도 — 도면은 그의 밖에서 계속 살았다.[/b] 그것이 한 인간이 견딜 수 있는 무게의 끝이었을지도."},{"text":"아직 죽지 않았다 — 그의 도면이 600년째 살아 있으므로","feedback":"가장 멀리 본 답이다. 우리가 광화문(경복궁의 정문) 앞을 걷는 한 — 정도전은 [b]살아 있다.[/b] 사람은 잊혀질 때 죽는다. 그러나 정도전은 — 도면 안에서 [em]잊혀지지 않는다.[/em] 우리가 모르는 사이에도 — 그는 우리를 [b]자기 도면 위에 세워두고 있다.[/b]"}]},"progLabel":"4막 · 1398년"},{"type":"deep","tag":"4막 · 깊게 살펴보기","title":"도면이 사람보다 오래 산다","text":"1398년 8월 26일. 몸이 죽었다. 1865년 가을. 흥선대원군(고종 임금의 아버지)이 그의 죄를 벗기고 이름을 되살려 주었다. [b]467년이 지났다.[/b] 그동안 정도전은 — 공식적으로 [em]역적[/em]이었다. 이름이 거론될 때마다 — 비난의 대상이었다.\n\n그러나 — 그 467년 동안 한양은 [b]그가 그린 그대로[/b] 작동했다. 임진왜란에 경복궁이 불탔다 — 다시 세웠다. 그가 그린 자리에. 그가 정한 방향으로. 그가 적은 이름으로. 근정전. 사정전. 강녕전. 교태전. 흥인지문. 돈의문. 숭례문. 숙정문.\n\n[em]그가 죽은 후[/em]에도 — 신하들은 [b]그가 그린 자리[/b]에서 일했다. 영의정. 좌의정. 우의정. 의정부(나라의 큰일을 의논하는 으뜸 관청). 6조(나랏일을 여섯 갈래로 나눠 맡은 관청). 이방원이 [em]재상 중심[/em]을 무너뜨리고 [em]강한 왕[/em]으로 가려 했지만 — 완전히 무너뜨리지 못했다. 그가 그린 구조가 — 너무 잘 만들어져 있어서, 다음 왕들도 결국 — [b]그 구조 안에서[/b] 움직였다.\n\n[b]도면이 사람보다 오래 산다.[/b] 그것이 정도전이 자기 어린 시절 — 마당에서부터 알고 있었던 답이었다. *\"종의 자식\"*이라 불리던 그 아이가 — 그 답을 평생에 걸쳐 [em]증명했다.[/em]","quote":"사람이 죽는 것은 한 번이지만, [em]도면[/em]을 그린 사람의 죽음은 — 도면이 사라질 때까지 [b]미뤄진다.[/b]","actId":"act4","progLabel":"4막 · 깊게 살펴보기","last":true},{"type":"epilogue","year":"에필로그 · 도면이 사람보다 오래 산다","title":"남은 것과 무너진 것","paragraphs":["[b]1398년 8월 26일.[/b] 남은의 집 가까운 골목에서 한 사람이 죽었다. 쉰여섯이었다. 어린 시절 \"종의 자식\"이라 불리던 아이가 — 한 나라의 도면을 그리고, [em]자기가 그린 도면 위에서[/em] 죽었다.","그가 가장 지키고 싶었던 도면은 — [b]가장 먼저 무너졌다.[/b] 그를 죽인 다섯째가 왕이 되었고, [em]재상 중심의 정치[/em]를 정확히 거꾸로 뒤집었다. 임금이 6조를 직접 거느리는 나라. 정도전이 「경제문감」에 [b]위험하다고 적어 둔 바로 그 모양[/b]이었다.","오래 남은 것은 그가 가장 공들인 이론이 아니라 — [b]자리와 이름[/b]이었다. 북악산 아래 그가 고른 자리. 전각마다 그가 단 이름. 사대문에 새긴 네 글자. [em]이론은 뒤집을 수 있지만, 자리는 옮기기 어렵다.[/em]","그는 467년 동안 역적이었다. 그 467년 동안 — 신하들은 그가 그린 자리에 앉아 일했다. [b]이름이 지워진 채로 도면은 돌아갔다.[/b]","그는 흠 하나 없는 설계자가 아니었다. 사람에게 당했고, 그래서 사람을 믿지 않게 되었고, 사람 대신 글자에 나라를 맡겼다. [em]당신과 같은 사람이었다.[/em] 다만 그는 — 당한 것을 도면으로 갚았다.","지금. 광화문. 사람들이 모여 있다. 어떤 결정이 이 자리에서 만들어진다. 사람들은 — 자기들이 누구의 도면 위에 서 있는지 [b]알지 못한다.[/b]"],"quote":"사람은 [em]몸[/em]이 죽을 때 죽지 않는다.\n사람은 [em]의지[/em]가 죽을 때 죽지 않는다.\n사람은 — [b]잊혀질 때 죽는다.[/b]\n\n정도전은 467년 동안 잊혀져 있었다.\n그런데 그가 그린 자리에서는 사람들이 계속 살았다.\n\n[em]그는 죽어 있었는가, 살아 있었는가.[/em]\n\n그리고 당신은 — [b]무엇을 남기겠는가.[/b]","progLabel":"에필로그"}]};
  if (window.GameEngine && typeof window.GameEngine.start === 'function') {
